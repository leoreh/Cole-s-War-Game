<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>running</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; }
  pre { font-size: 13px; line-height: 1.45; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>War Game engine tests</h1>
<pre id="out"></pre>

<script src="../src/engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.WarGame.Engine;
  var lines = [], failures = 0, count = 0;

  /* ---------- tiny harness ---------- */

  function test(name, fn) {
    count += 1;
    try {
      fn();
      lines.push('PASS  ' + name);
    } catch (e) {
      failures += 1;
      lines.push('FAIL  ' + name + ': ' + (e && e.message ? e.message : e));
    }
  }

  function assert(cond, msg) {
    if (!cond) throw new Error(msg || 'expected true');
  }

  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== typeof b || a === null || b === null) return false;
    if (typeof a !== 'object') return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    var ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    return ka.every(function (k) { return kb.indexOf(k) >= 0 && deepEqual(a[k], b[k]); });
  }

  function show(v) {
    return typeof v === 'object' ? JSON.stringify(v) : String(v);
  }

  function assertEqual(actual, expected, msg) {
    if (!deepEqual(actual, expected)) {
      throw new Error((msg ? msg + ': ' : '') + 'got ' + show(actual) + ', expected ' + show(expected));
    }
  }

  function assertThrows(fn, msg) {
    var threw = false;
    try { fn(); } catch (e) { threw = true; }
    if (!threw) throw new Error(msg || 'expected a throw');
  }

  /* ---------- building positions ---------- */

  // specs: { id?, owner, kind|kinds, row, col, hp?, maxHp? }
  // opts:  { player, number, used, pendingMerge, winner, rules }
  function position(specs, opts) {
    opts = opts || {};
    var st = {
      rules: { diagonalMoves: true },
      pieces: {},
      turn: {
        player: opts.player === undefined ? 0 : opts.player,
        number: opts.number === undefined ? 1 : opts.number,
        used: opts.used ? JSON.parse(JSON.stringify(opts.used)) : []
      },
      pendingMerge: opts.pendingMerge === undefined ? null : opts.pendingMerge,
      winner: opts.winner === undefined ? null : opts.winner,
      firstPlayer: 0
    };
    if (opts.rules) Object.keys(opts.rules).forEach(function (k) { st.rules[k] = opts.rules[k]; });
    specs.forEach(function (sp, i) {
      var kinds = sp.kinds || [sp.kind];
      var baseHp = 0;
      kinds.forEach(function (k) { baseHp += E.KINDS[k].hp; });
      var id = sp.id || ('p' + sp.owner + '-' + i);
      st.pieces[id] = {
        id: id, owner: sp.owner, kinds: kinds.slice(),
        hp: sp.hp === undefined ? baseHp : sp.hp,
        maxHp: sp.maxHp === undefined ? baseHp : sp.maxHp,
        row: sp.row, col: sp.col
      };
    });
    return st;
  }

  // combo slots already spent this turn, as turn.used entries
  function slots() {
    return Array.prototype.slice.call(arguments).map(function (k, i) {
      return { id: 'spent' + i, kind: k, fireLeft: false };
    });
  }

  function ofType(actions, type) {
    return actions.filter(function (a) { return a.type === type; });
  }

  function hasMove(actions, row, col) {
    return actions.some(function (a) { return a.type === 'move' && a.to.row === row && a.to.col === col; });
  }

  function hasTarget(actions, type, id) {
    return actions.some(function (a) { return a.type === type && a.target === id; });
  }

  function targets(actions, type) {
    return ofType(actions, type).map(function (a) { return a.target; }).sort();
  }

  function eventTypes(events) {
    return events.map(function (e) { return e.type; });
  }

  function sorted(list) {
    return list.slice().sort(function (a, b) { return a < b ? -1 : (a > b ? 1 : 0); });
  }

  function kindSet(state) {
    return Array.from(E.activatableKinds(state)).sort();
  }

  function move(state, id, row, col) {
    return E.apply(state, { type: 'move', piece: id, to: { row: row, col: col } }).state;
  }

  /* ---------- setup ---------- */

  test('setup: 32 pieces, default rules and a fresh turn', function () {
    var s = E.newGame({}, 0);
    assertEqual(Object.keys(s.pieces).length, 32, 'piece count');
    assertEqual(s.rules, { diagonalMoves: true }, 'default rules');
    assertEqual(E.DEFAULT_RULES, { diagonalMoves: true }, 'the exported defaults');
    assertEqual(s.turn.player, 0);
    assertEqual(s.firstPlayer, 0);
    assertEqual(s.turn.number, 1);
    assertEqual(s.turn.used, []);
    assertEqual(s.pendingMerge, null);
    assertEqual(s.winner, null);
    assertEqual(E.newGame({ diagonalMoves: false }, 1).rules, { diagonalMoves: false }, 'rules merged over defaults');
    assertEqual(E.newGame({}, 1).turn.player, 1, 'firstPlayer honoured');
  });

  test('setup: 8 S on the back row, 4 K and 4 A on columns 2 to 5', function () {
    var s = E.newGame({}, 0);
    [0, 1].forEach(function (pl) {
      var ps = E.piecesOf(s, pl);
      assertEqual(ps.length, 16, 'pieces of player ' + pl);
      var back = pl === 0 ? 0 : 7, second = pl === 0 ? 1 : 6, third = pl === 0 ? 2 : 5;
      var byKind = function (k) { return ps.filter(function (p) { return p.kinds[0] === k; }); };

      var sol = byKind('S');
      assertEqual(sol.length, 8, 'soldiers');
      assert(sol.every(function (p) { return p.row === back; }), 'soldiers on the back row');
      assertEqual(sorted(sol.map(function (p) { return p.col; })), [0, 1, 2, 3, 4, 5, 6, 7]);

      var kn = byKind('K');
      assertEqual(kn.length, 4, 'knights');
      assert(kn.every(function (p) { return p.row === second; }), 'knights on the second row');
      assertEqual(sorted(kn.map(function (p) { return p.col; })), [2, 3, 4, 5]);

      var ar = byKind('A');
      assertEqual(ar.length, 4, 'archers');
      assert(ar.every(function (p) { return p.row === third; }), 'archers on the third row');
      assertEqual(sorted(ar.map(function (p) { return p.col; })), [2, 3, 4, 5]);
      assert(ar.every(function (p) { return p.hp === 3 && p.maxHp === 3; }), 'archers have hp 3');

      assert(ps.every(function (p) { return p.hp === p.maxHp; }), 'pieces start at full health');
      assert(ps.every(function (p) { return p.id.indexOf('p' + pl + '-') === 0; }), 'id form');
    });
  });

  test('pieceStats: health, strength, move, fire and range of each kind', function () {
    var s = E.newGame({}, 0);
    assertEqual(E.pieceStats(s.pieces['p0-0']),
      { str: 1, baseStr: 1, hp: 1, maxHp: 1, move: 2, fire: 0, range: 0, comboKind: 'S' }, 'soldier');
    assertEqual(E.pieceStats(s.pieces['p0-8']),
      { str: 3, baseStr: 3, hp: 3, maxHp: 3, move: 4, fire: 0, range: 0, comboKind: 'K' }, 'knight');
    assertEqual(E.pieceStats(s.pieces['p0-12']),
      { str: 0, baseStr: 0, hp: 3, maxHp: 3, move: 2, fire: 2, range: 2, comboKind: 'A' }, 'archer');
  });

  test('comboKind: K beats A beats S', function () {
    assertEqual(E.comboKind({ kinds: ['K', 'A'] }), 'K');
    assertEqual(E.comboKind({ kinds: ['A', 'S'] }), 'A');
    assertEqual(E.comboKind({ kinds: ['S', 'S'] }), 'S');
    assertEqual(E.comboKind({ kinds: ['S'] }), 'S');
  });

  test('pieceAt and piecesOf', function () {
    var s = E.newGame({}, 0);
    assertEqual(E.pieceAt(s, 0, 0).id, 'p0-0');
    assertEqual(E.pieceAt(s, 3, 3), null);
    assertEqual(E.piecesOf(s, 1).length, 16);
  });

  /* ---------- melee ---------- */

  // attacker at (3,3) of player 0, defender at (3,4) of player 1, plus a spare each
  function melee(att, def) {
    var st = position([
      { id: 'a', owner: 0, kind: att.kind, hp: att.hp, row: 3, col: 3 },
      { id: 'd', owner: 1, kind: def.kind, hp: def.hp, row: 3, col: 4 },
      { id: 'sp0', owner: 0, kind: 'S', row: 0, col: 0 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    return E.apply(st, { type: 'attack', piece: 'a', target: 'd' });
  }

  test('melee: soldier attacks soldier, both die', function () {
    var r = melee({ kind: 'S' }, { kind: 'S' });
    assertEqual(r.state.pieces['a'], undefined, 'attacker dead');
    assertEqual(r.state.pieces['d'], undefined, 'defender dead');
    var atk = r.events[0];
    assertEqual(atk.type, 'attack');
    assertEqual(atk.attackerLoss, 1);
    assertEqual(atk.defenderLoss, 1);
    assertEqual(atk.attackerMoved, false);
    assertEqual(ofType(r.events, 'die').length, 2);
  });

  test('melee: knight attacks soldier, the soldier dies and the knight ends at 2 on the square', function () {
    var r = melee({ kind: 'K' }, { kind: 'S' });
    assertEqual(r.state.pieces['d'], undefined, 'soldier dead');
    assertEqual(r.state.pieces['a'].hp, 2, 'knight health');
    assertEqual(E.pieceStats(r.state.pieces['a']).str, 2, 'and strength 2');
    assertEqual([r.state.pieces['a'].row, r.state.pieces['a'].col], [3, 4], 'knight took the square');
    assertEqual(r.events[0].attackerMoved, true);
  });

  test('melee: soldier attacks knight, the soldier dies and the knight stays at 2', function () {
    var r = melee({ kind: 'S' }, { kind: 'K' });
    assertEqual(r.state.pieces['a'], undefined, 'soldier dead');
    assertEqual(r.state.pieces['d'].hp, 2, 'knight health');
    assertEqual(r.state.pieces['d'].col, 4, 'knight stayed');
  });

  test('melee: soldier attacks a knight at 1, both die', function () {
    var r = melee({ kind: 'S' }, { kind: 'K', hp: 1 });
    assertEqual(r.state.pieces['a'], undefined, 'the knight at 1 hits for 1');
    assertEqual(r.state.pieces['d'], undefined);
  });

  test('melee: a knight at 2 attacks a knight at 3, the attacker dies and the defender ends at 1', function () {
    var r = melee({ kind: 'K', hp: 2 }, { kind: 'K' });
    assertEqual(r.state.pieces['a'], undefined, 'attacker dead');
    assertEqual(r.state.pieces['d'].hp, 1);
    assertEqual(r.state.pieces['d'].col, 4, 'defender stayed');
  });

  test('melee: a soldier attacks an archer, the archer drops to 2 and the soldier stays unharmed', function () {
    var r = melee({ kind: 'S' }, { kind: 'A' });
    assertEqual(r.state.pieces['d'].hp, 2, 'archer at 2');
    assertEqual(r.state.pieces['a'].hp, 1, 'the archer hits for 0');
    assertEqual([r.state.pieces['a'].row, r.state.pieces['a'].col], [3, 3], 'the soldier stayed in place');
    assertEqual(r.events[0].attackerMoved, false);
    assertEqual(eventTypes(r.events), ['attack'], 'nobody died');
  });

  test('strength follows health: a hybrid K+A hits for 3 at full health and for 2 at health 2', function () {
    var full = position([{ id: 'h', owner: 0, kinds: ['K', 'A'], row: 3, col: 3 }]);
    assertEqual(E.pieceStats(full.pieces['h']).baseStr, 3, 'K+A base strength');
    assertEqual(E.pieceStats(full.pieces['h']).maxHp, 6, 'K+A health 6');
    assertEqual(E.pieceStats(full.pieces['h']).str, 3, 'at 6 it hits for 3');

    var hurt = position([{ id: 'h', owner: 0, kinds: ['K', 'A'], hp: 2, row: 3, col: 3 }]);
    assertEqual(E.pieceStats(hurt.pieces['h']).str, 2, 'at 2 it hits for 2');
  });

  test('strength follows health: a knight at 2 takes 2 off its target', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', hp: 2, row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'A', row: 3, col: 4 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var r = E.apply(st, { type: 'attack', piece: 'k', target: 'd' });
    assertEqual(r.events[0].defenderLoss, 2, 'it hits for 2, not 3');
    assertEqual(r.state.pieces['d'].hp, 1, 'the archer drops from 3 to 1');
  });

  /* ---------- movement ---------- */

  test('movement: a soldier reaches every square at path cost 2 or less, corners included', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'S', row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var reach = E.reachable(st, 'a');
    var expected = {
      '2,3': 1, '4,3': 1, '3,2': 1, '3,4': 1,
      '1,3': 2, '5,3': 2, '3,1': 2, '3,5': 2,
      '2,2': 2, '2,4': 2, '4,2': 2, '4,4': 2
    };
    assertEqual(sorted(Object.keys(reach)), sorted(Object.keys(expected)), 'the reachable squares');
    Object.keys(expected).forEach(function (k) {
      assertEqual(reach[k].cost, expected[k], 'cost to ' + k);
    });
    var acts = E.legalActions(st, 'a');
    assertEqual(ofType(acts, 'move').length, 12, 'every reachable square is a move');
    assert(!hasMove(acts, 3, 6), 'never three squares away');
  });

  test('movement: a knight reaches every square at path cost 4 or less', function () {
    var st = position([{ id: 'a', owner: 0, kind: 'K', row: 3, col: 3 }]);
    var reach = E.reachable(st, 'a');
    var n = 0;
    for (var row = 0; row < 8; row++) {
      for (var col = 0; col < 8; col++) {
        // a diagonal step costs exactly the two orthogonal steps it replaces,
        // so on an open board the cheapest cost is the manhattan distance
        var dist = Math.abs(row - 3) + Math.abs(col - 3);
        var k = row + ',' + col;
        if (dist === 0 || dist > 4) { assertEqual(reach[k], undefined, 'not reachable: ' + k); continue; }
        assert(reach[k], 'reachable: ' + k);
        assertEqual(reach[k].cost, dist, 'cost to ' + k);
        n += 1;
      }
    }
    assertEqual(Object.keys(reach).length, n, 'nothing else is reachable');
    assertEqual(n, 38, 'the squares within four points');
  });

  test('movement: with diagonal moves a diagonal neighbour is one step, without it two', function () {
    var specs = [{ id: 'a', owner: 0, kind: 'S', row: 3, col: 3 }];
    var on = E.reachable(position(specs), 'a')['4,4'];
    assertEqual([on.cost, on.steps], [2, 1], 'one diagonal step');
    assertEqual(on.path, [{ row: 4, col: 4 }]);

    var off = E.reachable(position(specs, { rules: { diagonalMoves: false } }), 'a')['4,4'];
    assertEqual([off.cost, off.steps], [2, 2], 'around the corner');
    assertEqual(off.path.length, 2);
    assertEqual(off.path[1], { row: 4, col: 4 });
    assert(deepEqual(off.path[0], { row: 4, col: 3 }) || deepEqual(off.path[0], { row: 3, col: 4 }), 'via a neighbour');
  });

  test('movement: with diagonal moves a knight reaches the two-step diagonal', function () {
    var specs = [{ id: 'a', owner: 0, kind: 'K', row: 3, col: 3 }];
    var on = E.reachable(position(specs), 'a')['5,5'];
    assertEqual([on.cost, on.steps], [4, 2], 'two diagonal steps');
    assertEqual(on.path, [{ row: 4, col: 4 }, { row: 5, col: 5 }]);

    var off = E.reachable(position(specs, { rules: { diagonalMoves: false } }), 'a')['5,5'];
    assertEqual([off.cost, off.steps], [4, 4], 'four orthogonal steps');
  });

  test('movement: an own piece is passed over but is never a destination', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', row: 3, col: 0 },
      { id: 'f', owner: 0, kind: 'S', row: 3, col: 1 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var reach = E.reachable(st, 'k');
    assertEqual(reach['3,1'], undefined, 'no path ends on an own piece');
    assertEqual(reach['3,2'].cost, 2, 'straight through the friend');
    assertEqual(reach['3,2'].path, [{ row: 3, col: 1 }, { row: 3, col: 2 }], 'the path crosses it');
    var acts = E.legalActions(st, 'k');
    assert(!hasMove(acts, 3, 1), 'no move onto an own piece');
    assert(!hasTarget(acts, 'attack', 'f'), 'no attack on an own piece');
    assert(hasMove(acts, 3, 2), 'the square behind it is reachable');
  });

  test('movement: an enemy ends a path and is never passed over', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', row: 3, col: 0 },
      { id: 'e', owner: 1, kind: 'S', row: 3, col: 1 },
      { id: 'e2', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var reach = E.reachable(st, 'k');
    assertEqual(reach['3,1'].cost, 1, 'the enemy square is a path end');
    assertEqual(reach['3,2'].cost, 4, 'the square behind it costs a detour');
    Object.keys(reach).forEach(function (k) {
      reach[k].path.slice(0, -1).forEach(function (sq) {
        assert(!(sq.row === 3 && sq.col === 1), 'no path crosses the enemy: ' + k);
      });
    });
    assert(hasTarget(E.legalActions(st, 'k'), 'attack', 'e'), 'but it may be attacked');
  });

  test('movement: an enemy out of reach blocks the square behind it for a soldier', function () {
    var st = position([
      { id: 's', owner: 0, kind: 'S', row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 3, col: 4 }
    ]);
    var reach = E.reachable(st, 's');
    assertEqual(reach['3,4'].cost, 1, 'the enemy itself is reachable');
    assertEqual(reach['3,5'], undefined, 'and nothing may pass it inside the budget');
    assertThrows(function () { E.apply(st, { type: 'move', piece: 's', to: { row: 3, col: 5 } }); });
  });

  test('movement: every reported path is adjacent in order and matches its cost', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', row: 3, col: 3 },
      { id: 'f', owner: 0, kind: 'S', row: 3, col: 4 },
      { id: 'e', owner: 1, kind: 'S', row: 2, col: 3 }
    ]);
    var reach = E.reachable(st, 'k');
    assert(Object.keys(reach).length > 0, 'something is reachable');
    Object.keys(reach).forEach(function (k) {
      var n = reach[k];
      assertEqual(n.steps, n.path.length, 'steps count the path: ' + k);
      var prev = { row: 3, col: 3 }, cost = 0;
      n.path.forEach(function (sq) {
        var dr = Math.abs(sq.row - prev.row), dc = Math.abs(sq.col - prev.col);
        assert(dr <= 1 && dc <= 1 && dr + dc > 0, 'adjacent step in ' + k);
        cost += (dr === 1 && dc === 1) ? 2 : 1;
        prev = sq;
      });
      assertEqual(cost, n.cost, 'the cost is the sum of the steps: ' + k);
      assertEqual(prev.row + ',' + prev.col, k, 'the path ends on the square');
    });
  });

  test('movement: a move is applied with its path and locks the piece', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'S', row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var r = E.apply(st, { type: 'move', piece: 'a', to: { row: 5, col: 3 } });
    assertEqual(r.events, [{
      type: 'move', id: 'a', from: { row: 3, col: 3 }, to: { row: 5, col: 3 },
      path: [{ row: 4, col: 3 }, { row: 5, col: 3 }], cost: 2, fireLeft: false
    }]);
    assertEqual(r.state.pieces['a'].row, 5);
    assertEqual(r.state.turn.used, [{ id: 'a', kind: 'S', fireLeft: false }]);
    assertEqual(E.legalActions(r.state, 'a'), [], 'a used piece has no actions');
    assertEqual(E.canActivate(r.state, 'a'), false);
  });

  /* ---------- fire ---------- */

  test('fire: an archer has no attack actions', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 3, col: 4 }
    ]);
    var acts = E.legalActions(st, 'a');
    assertEqual(ofType(acts, 'attack').length, 0, 'strength 0 never attacks');
    assert(hasTarget(acts, 'fire', 'e'), 'but it may fire');
    assertThrows(function () { E.apply(st, { type: 'attack', piece: 'a', target: 'e' }); });
  });

  test('fire: range 2 in the row or the column, never diagonal', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'row2', owner: 1, kind: 'K', row: 3, col: 5 },
      { id: 'row3', owner: 1, kind: 'K', row: 3, col: 6 },
      { id: 'col2', owner: 1, kind: 'K', row: 1, col: 3 },
      { id: 'diag', owner: 1, kind: 'K', row: 4, col: 4 }
    ]);
    assertEqual(targets(E.legalActions(st, 'a'), 'fire'), ['col2', 'row2'], 'only the two at distance 2 in a line');
    assertThrows(function () { E.apply(st, { type: 'fire', piece: 'a', target: 'row3' }); }, 'distance 3 is out');
    assertThrows(function () { E.apply(st, { type: 'fire', piece: 'a', target: 'diag' }); }, 'fire is never diagonal');
  });

  test('fire: nothing in between blocks', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'near', owner: 1, kind: 'S', row: 3, col: 4 },
      { id: 'behind', owner: 1, kind: 'K', row: 3, col: 5 },
      { id: 'friend', owner: 0, kind: 'S', row: 4, col: 3 },
      { id: 'past', owner: 1, kind: 'K', row: 5, col: 3 }
    ]);
    var acts = E.legalActions(st, 'a');
    assert(hasTarget(acts, 'fire', 'behind'), 'over an enemy');
    assert(hasTarget(acts, 'fire', 'past'), 'over an own piece');
    assertEqual(E.apply(st, { type: 'fire', piece: 'a', target: 'behind' }).state.pieces['behind'].hp, 1);
  });

  test('fire: a knight at 3 drops to 1 and the shooter neither loses nor moves', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'K', row: 3, col: 4 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var r = E.apply(st, { type: 'fire', piece: 'a', target: 'd' });
    assertEqual(r.events, [{ type: 'fire', shooter: 'a', target: 'd', damage: 2 }]);
    assertEqual(r.state.pieces['d'].hp, 1);
    assertEqual(r.state.pieces['a'].hp, 3, 'the shooter loses nothing');
    assertEqual([r.state.pieces['a'].row, r.state.pieces['a'].col], [3, 3], 'and does not move');
    assertEqual(r.state.turn.used, [{ id: 'a', kind: 'A', fireLeft: false }]);
  });

  test('fire: a soldier dies of one shot', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'S', row: 3, col: 4 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var r = E.apply(st, { type: 'fire', piece: 'a', target: 'd' });
    assertEqual(r.state.pieces['d'], undefined);
    assertEqual(eventTypes(r.events), ['fire', 'die']);
  });

  test('fire: an archer at 3 drops to 1', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'A', row: 3, col: 4 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    assertEqual(E.apply(st, { type: 'fire', piece: 'a', target: 'd' }).state.pieces['d'].hp, 1);
  });

  /* ---------- move then fire ---------- */

  // an archer one step away from bringing the enemy knight into range
  function archerAndTarget() {
    return position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'K', row: 3, col: 6 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
  }

  test('move then fire: an archer that moved one step keeps its shot and nothing else', function () {
    var r = E.apply(archerAndTarget(), { type: 'move', piece: 'a', to: { row: 3, col: 4 } });
    assertEqual(r.events[0].fireLeft, true, 'the move event says so');
    assertEqual(r.state.turn.used, [{ id: 'a', kind: 'A', fireLeft: true }]);
    assertEqual(E.canFireAgain(r.state, 'a'), true);
    assertEqual(E.canActivate(r.state, 'a'), false, 'it is still spent for everything else');
    var acts = E.legalActions(r.state, 'a');
    assertEqual(ofType(acts, 'move').length, 0, 'no second move');
    assertEqual(targets(acts, 'fire'), ['e'], 'it fires from its new square');
  });

  test('move then fire: after the shot the archer is done', function () {
    var moved = E.apply(archerAndTarget(), { type: 'move', piece: 'a', to: { row: 3, col: 4 } }).state;
    var r = E.apply(moved, { type: 'fire', piece: 'a', target: 'e' });
    assertEqual(r.state.pieces['e'].hp, 1);
    assertEqual(r.state.turn.used, [{ id: 'a', kind: 'A', fireLeft: false }], 'the shot adds no slot');
    assertEqual(E.canFireAgain(r.state, 'a'), false);
    assertEqual(E.legalActions(r.state, 'a'), []);
  });

  test('move then fire: two steps forfeit the shot', function () {
    var r = E.apply(archerAndTarget(), { type: 'move', piece: 'a', to: { row: 3, col: 5 } });
    assertEqual(r.events[0].cost, 2);
    assertEqual(r.events[0].fireLeft, false, 'two steps, no shot');
    assertEqual(E.canFireAgain(r.state, 'a'), false);
    assertEqual(E.legalActions(r.state, 'a'), [], 'even with the enemy one square away');
    assertThrows(function () { E.apply(r.state, { type: 'fire', piece: 'a', target: 'e' }); });
  });

  test('move then fire: the kept shot costs no combination slot after K and A', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', row: 0, col: 0 },
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'K', row: 3, col: 6 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var s = move(st, 'k', 0, 1);
    s = move(s, 'a', 3, 4);
    assertEqual(E.usedKinds(s), ['K', 'A']);
    assertEqual(kindSet(s), [], 'K+A is full');
    s = E.apply(s, { type: 'fire', piece: 'a', target: 'e' }).state;
    assertEqual(s.turn.used.length, 2, 'the shot added no entry');
    assertEqual(E.hasAnyAction(s), false, 'and nothing else may act');
  });

  test('move then fire: the shot survives a full A+S+S turn', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 's1', owner: 0, kind: 'S', row: 0, col: 0 },
      { id: 's2', owner: 0, kind: 'S', row: 0, col: 2 },
      { id: 'e', owner: 1, kind: 'K', row: 3, col: 6 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var s = move(st, 'a', 3, 4);
    s = move(s, 's1', 1, 0);
    s = move(s, 's2', 1, 2);
    assertEqual(E.usedKinds(s), ['A', 'S', 'S']);
    assertEqual(kindSet(s), [], 'the combination is full');
    assertEqual(E.canFireAgain(s, 'a'), true);
    assertEqual(targets(E.legalActions(s, 'a'), 'fire'), ['e']);
    assertEqual(E.apply(s, { type: 'fire', piece: 'a', target: 'e' }).state.pieces['e'].hp, 1);
  });

  /* ---------- combinations ---------- */

  test('combos: a fresh turn takes any kind, after a knight only S or A', function () {
    var pieces = [
      { id: 'k', owner: 0, kind: 'K', row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ];
    assertEqual(kindSet(position(pieces)), ['A', 'K', 'S'], 'a fresh turn');
    assertEqual(kindSet(position(pieces, { used: slots('K') })), ['A', 'S'], 'after K');
    assertEqual(E.canActivate(position(pieces, { used: slots('K') }), 'k'), false, 'only one knight a turn');
  });

  test('combos: after S+S a third S or an A, never a K', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', row: 3, col: 3 },
      { id: 's', owner: 0, kind: 'S', row: 5, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ], { used: slots('S', 'S') });
    assertEqual(kindSet(st), ['A', 'S']);
    assertEqual(E.canActivate(st, 'k'), false, 'no knight after two soldiers');
    assertEqual(E.canActivate(st, 's'), true);
  });

  test('combos: after A+A only a soldier, and a third archer never', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 's', owner: 0, kind: 'S', row: 5, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ], { used: slots('A', 'A') });
    assertEqual(kindSet(st), ['S']);
    assertEqual(E.canActivate(st, 'a'), false, 'a third archer is never activatable');
    assertEqual(E.legalActions(st, 'a'), []);
    assertEqual(E.canActivate(st, 's'), true);
  });

  test('combos: after A+S+S nothing is activatable', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 's', owner: 0, kind: 'S', row: 5, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ], { used: slots('A', 'S', 'S') });
    assertEqual(kindSet(st), [], 'the combination is full');
    assertEqual(E.hasAnyAction(st), false);
    assertThrows(function () { E.apply(st, { type: 'move', piece: 's', to: { row: 5, col: 4 } }); });
  });

  test('combos: a hybrid counts by its combo kind', function () {
    var st = position([
      { id: 'h', owner: 0, kinds: ['S', 'K'], row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ], { used: slots('K') });
    assertEqual(E.canActivate(st, 'h'), false, 'an S+K hybrid counts as K');
  });

  /* ---------- heal ---------- */

  test('heal: adds 0.5 and is capped at max health', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', hp: 2, row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    assertEqual(E.canHeal(st, 'k'), true);
    assertEqual(ofType(E.legalActions(st, 'k'), 'heal').length, 1, 'heal is offered');
    var r = E.apply(st, { type: 'heal', piece: 'k' });
    assertEqual(r.events, [{ type: 'heal', id: 'k', amount: 0.5, hp: 2.5 }]);
    assertEqual(r.state.pieces['k'].hp, 2.5);

    var capped = E.apply(position([
      { id: 'k', owner: 0, kind: 'K', hp: 2.5, row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]), { type: 'heal', piece: 'k' });
    assertEqual(capped.state.pieces['k'].hp, 3, 'capped at max health');
    assertEqual(E.canHeal(capped.state, 'k'), false, 'a full piece cannot heal');
  });

  test('heal: an archer at 2 heals although its strength is 0', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', hp: 2, row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    assertEqual(E.canHeal(st, 'a'), true);
    assertEqual(E.apply(st, { type: 'heal', piece: 'a' }).state.pieces['a'].hp, 2.5);
  });

  test('heal: a healed piece cannot act again this turn', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', hp: 2, row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var r = E.apply(st, { type: 'heal', piece: 'k' });
    assertEqual(r.state.turn.used, [{ id: 'k', kind: null, fireLeft: false }]);
    assertEqual(E.legalActions(r.state, 'k'), [], 'a healed piece cannot move');
    assertThrows(function () { E.apply(r.state, { type: 'move', piece: 'k', to: { row: 3, col: 4 } }); });
  });

  test('heal: a piece that has acted cannot heal', function () {
    var st = position([
      { id: 's', owner: 0, kind: 'S', hp: 0.5, row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var r = E.apply(st, { type: 'move', piece: 's', to: { row: 3, col: 4 } });
    assertEqual(E.canHeal(r.state, 's'), false);
    assertThrows(function () { E.apply(r.state, { type: 'heal', piece: 's' }); });
  });

  test('heal: healing consumes no combination slot', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', hp: 2, row: 0, col: 0 },
      { id: 's1', owner: 0, kind: 'S', row: 2, col: 0 },
      { id: 's2', owner: 0, kind: 'S', row: 4, col: 0 },
      { id: 's3', owner: 0, kind: 'S', row: 6, col: 0 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]);
    var s = E.apply(st, { type: 'heal', piece: 'k' }).state;
    assertEqual(E.usedKinds(s), [], 'a heal is not a combo kind');
    assertEqual(E.canActivate(s, 'k'), false, 'but the knight is spent');
    s = move(s, 's1', 2, 1);
    s = move(s, 's2', 4, 1);
    assertEqual(E.canActivate(s, 's3'), true, 'S+S+S is allowed after a heal');
    s = move(s, 's3', 6, 1);
    assertEqual(E.usedKinds(s), ['S', 'S', 'S']);
  });

  /* ---------- merge ---------- */

  function onFarRow(kind) {
    var st = position([
      { id: 'p', owner: 0, kind: kind, row: 6, col: 3 },
      { id: 'other', owner: 0, kind: 'S', row: 0, col: 0 },
      { id: 'e', owner: 1, kind: 'S', row: 4, col: 7 }
    ]);
    return E.apply(st, { type: 'move', piece: 'p', to: { row: 7, col: 3 } });
  }

  test('merge: a soldier reaching row 7 gets pendingMerge and blocks everything else', function () {
    var r = onFarRow('S');
    assertEqual(r.state.pendingMerge, 'p');
    assertEqual(eventTypes(r.events), ['move', 'mergePending']);
    assertThrows(function () { E.apply(r.state, { type: 'endTurn' }); }, 'endTurn throws while pending');
    assertThrows(function () { E.apply(r.state, { type: 'move', piece: 'other', to: { row: 1, col: 0 } }); });
    assertEqual(E.canActivate(r.state, 'other'), false);
    assertEqual(E.legalActions(r.state, 'other'), []);
  });

  test('merge: player 1 promotes on row 0', function () {
    var st = position([
      { id: 's', owner: 1, kind: 'S', row: 1, col: 3 },
      { id: 'e', owner: 0, kind: 'S', row: 4, col: 7 }
    ], { player: 1 });
    assertEqual(E.apply(st, { type: 'move', piece: 's', to: { row: 0, col: 3 } }).state.pendingMerge, 's');
  });

  test('merge: S with K gives hp 4, maxHp 4, baseStr 4 and move 4', function () {
    var r = E.apply(onFarRow('S').state, { type: 'merge', piece: 'p', kind: 'K' });
    var p = r.state.pieces['p'];
    var st = E.pieceStats(p);
    assertEqual(p.kinds, ['S', 'K']);
    assertEqual([p.hp, p.maxHp], [4, 4]);
    assertEqual([st.baseStr, st.str, st.move], [4, 4, 4]);
    assertEqual(st.comboKind, 'K');
    assertEqual(r.state.pendingMerge, null);
    assertEqual(r.events, [{ type: 'merge', id: 'p', kinds: ['S', 'K'] }]);
  });

  test('merge: S with A gives fire 2 at range 2 and maxHp 4', function () {
    var r = E.apply(onFarRow('S').state, { type: 'merge', piece: 'p', kind: 'A' });
    var st = E.pieceStats(r.state.pieces['p']);
    assertEqual(r.state.pieces['p'].kinds, ['S', 'A']);
    assertEqual([st.fire, st.range], [2, 2]);
    assertEqual([st.hp, st.maxHp], [4, 4]);
    assertEqual([st.baseStr, st.str, st.move], [1, 1, 2]);
  });

  test('merge: A with A gives fire 4 at range 2 and maxHp 6', function () {
    var r = E.apply(onFarRow('A').state, { type: 'merge', piece: 'p', kind: 'A' });
    var st = E.pieceStats(r.state.pieces['p']);
    assertEqual([st.fire, st.range], [4, 2], 'fire adds up, range is the max');
    assertEqual([st.hp, st.maxHp], [6, 6]);
    assertEqual([st.baseStr, st.str, st.move], [0, 0, 2]);
  });

  test('merge: K with A and K with K follow the spec', function () {
    var ka = E.pieceStats(E.apply(onFarRow('K').state, { type: 'merge', piece: 'p', kind: 'A' }).state.pieces['p']);
    assertEqual([ka.move, ka.maxHp, ka.str, ka.fire, ka.range], [4, 6, 3, 2, 2], 'K+A');
    var kk = E.pieceStats(E.apply(onFarRow('K').state, { type: 'merge', piece: 'p', kind: 'K' }).state.pieces['p']);
    assertEqual([kk.move, kk.maxHp, kk.str, kk.fire], [4, 6, 6, 0], 'K+K');
  });

  test('merge: a hybrid on the far row does not merge again', function () {
    var st = position([
      { id: 'h', owner: 0, kinds: ['S', 'K'], row: 6, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 4, col: 7 }
    ]);
    var r = E.apply(st, { type: 'move', piece: 'h', to: { row: 7, col: 3 } });
    assertEqual(r.state.pendingMerge, null);
    assertEqual(eventTypes(r.events), ['move']);
  });

  test('merge: skipMerge clears the pending merge and leaves the piece alone', function () {
    var r = E.apply(onFarRow('S').state, { type: 'skipMerge', piece: 'p' });
    assertEqual(r.state.pendingMerge, null);
    assertEqual(r.state.pieces['p'].kinds, ['S']);
    assertEqual(r.state.pieces['p'].hp, 1);
    assertEqual(r.events, []);
    assertEqual(E.apply(r.state, { type: 'endTurn' }).state.turn.player, 1, 'endTurn works again');
  });

  test('merge: an attack that ends on the far row promotes too', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', row: 6, col: 3 },
      { id: 'd', owner: 1, kind: 'S', row: 7, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 4, col: 7 }
    ]);
    var r = E.apply(st, { type: 'attack', piece: 'k', target: 'd' });
    assertEqual(r.state.pieces['k'].row, 7);
    assertEqual(r.state.pendingMerge, 'k');
    assertEqual(eventTypes(r.events), ['attack', 'die', 'mergePending']);
  });

  /* ---------- end of game ---------- */

  test('win: killing the last enemy piece sets the winner', function () {
    var st = position([
      { id: 'k', owner: 0, kind: 'K', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'S', row: 3, col: 4 }
    ]);
    var r = E.apply(st, { type: 'attack', piece: 'k', target: 'd' });
    assertEqual(r.state.winner, 0);
    assert(r.events.some(function (e) { return e.type === 'gameOver' && e.winner === 0; }), 'gameOver event');
    assertThrows(function () { E.apply(r.state, { type: 'endTurn' }); }, 'no action after the game is over');
    assertEqual(E.legalActions(r.state, 'k'), []);
  });

  test('win: mutual last-piece death is a draw', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'S', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'S', row: 3, col: 4 }
    ]);
    var r = E.apply(st, { type: 'attack', piece: 'a', target: 'd' });
    assertEqual(r.state.winner, 'draw');
    assert(r.events.some(function (e) { return e.type === 'gameOver' && e.winner === 'draw'; }));
  });

  test('win: fire that kills the last enemy piece also ends the game', function () {
    var st = position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'S', row: 3, col: 4 }
    ]);
    assertEqual(E.apply(st, { type: 'fire', piece: 'a', target: 'd' }).state.winner, 0);
  });

  /* ---------- turns ---------- */

  test('endTurn switches the player, bumps the number and clears used', function () {
    var st = E.newGame({}, 0);
    var moved = move(st, 'p0-0', 1, 0);
    var r = E.apply(moved, { type: 'endTurn' });
    assertEqual(r.state.turn.player, 1);
    assertEqual(r.state.turn.number, 2);
    assertEqual(r.state.turn.used, []);
    assertEqual(r.events, [
      { type: 'turnEnd', player: 0 },
      { type: 'turnStart', player: 1, number: 2 }
    ]);
  });

  test('pass: a player with no legal action is skipped', function () {
    var st = position([{ id: 's', owner: 0, kind: 'S', row: 3, col: 3 }]);
    assertEqual(E.hasAnyAction(st), true);
    var r = E.apply(st, { type: 'endTurn' });
    assertEqual(eventTypes(r.events), ['turnEnd', 'turnStart', 'pass', 'turnStart']);
    assertEqual(r.events[2], { type: 'pass', player: 1 });
    assertEqual(r.state.turn.player, 0, 'back to player 0');
    assertEqual(r.state.winner, null);
  });

  test('pass: when neither player can act the game is a draw', function () {
    var st = position([]);
    assertEqual(E.hasAnyAction(st), false);
    var r = E.apply(st, { type: 'endTurn' });
    assertEqual(r.state.winner, 'draw');
    assertEqual(eventTypes(r.events), ['turnEnd', 'turnStart', 'pass', 'turnStart', 'pass', 'gameOver']);
  });

  test('a piece of the other player cannot act, and nonsense is refused', function () {
    var st = E.newGame({}, 0);
    assertEqual(E.canActivate(st, 'p1-0'), false);
    assertEqual(E.legalActions(st, 'p1-0'), []);
    assertThrows(function () { E.apply(st, { type: 'move', piece: 'p1-0', to: { row: 6, col: 0 } }); });
    assertEqual(E.legalActions(st, 'nope'), [], 'an unknown id has no actions');
    assertEqual(E.reachable(st, 'nope'), {}, 'nor a reachable set');
    assertThrows(function () { E.apply(st, { type: 'nonsense' }); });
  });

  /* ---------- serialization and immutability ---------- */

  test('serialize then deserialize reproduces the state under the WG2 prefix', function () {
    var st = E.newGame({ diagonalMoves: false }, 1);
    var code = E.serialize(st);
    assert(code.indexOf('WG2.') === 0, 'prefix');
    assert(!/[+\/=]/.test(code), 'url-safe base64');
    assertEqual(E.deserialize(code), st, 'round trip');

    var played = E.apply(st, { type: 'move', piece: 'p1-0', to: { row: 6, col: 0 } }).state;
    assertEqual(E.deserialize(E.serialize(played)), played, 'round trip after an action');
  });

  test('deserialize refuses a version 1 code and anything malformed', function () {
    assertThrows(function () { E.deserialize('WG1.x'); }, 'a version 1 code is refused');
    assertThrows(function () { E.deserialize('WG1.' + E.serialize(E.newGame({}, 0)).slice(4)); });
    assertThrows(function () { E.deserialize('nonsense'); });
    assertThrows(function () { E.deserialize('WG2.@@@@'); });
    assertThrows(function () { E.deserialize(null); });
  });

  test('apply never mutates its input', function () {
    function unchanged(st, action) {
      var before = JSON.stringify(st);
      E.apply(st, action);
      assertEqual(JSON.stringify(st), before, 'input state after ' + action.type);
    }
    var game = E.newGame({}, 0);
    unchanged(game, { type: 'move', piece: 'p0-0', to: { row: 1, col: 0 } });
    unchanged(game, { type: 'endTurn' });

    unchanged(position([
      { id: 'a', owner: 0, kind: 'K', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'S', row: 3, col: 4 },
      { id: 'sp1', owner: 1, kind: 'S', row: 7, col: 7 }
    ]), { type: 'attack', piece: 'a', target: 'd' });

    unchanged(position([
      { id: 'a', owner: 0, kind: 'A', row: 3, col: 3 },
      { id: 'd', owner: 1, kind: 'K', row: 3, col: 4 }
    ]), { type: 'fire', piece: 'a', target: 'd' });

    unchanged(position([
      { id: 'k', owner: 0, kind: 'K', hp: 2, row: 3, col: 3 },
      { id: 'e', owner: 1, kind: 'S', row: 7, col: 7 }
    ]), { type: 'heal', piece: 'k' });

    var pending = onFarRow('S').state;
    unchanged(pending, { type: 'merge', piece: 'p', kind: 'K' });
    unchanged(pending, { type: 'skipMerge', piece: 'p' });

    var moved = E.apply(archerAndTarget(), { type: 'move', piece: 'a', to: { row: 3, col: 4 } }).state;
    unchanged(moved, { type: 'fire', piece: 'a', target: 'e' });
  });

  test('the readers do not mutate the state', function () {
    var st = E.newGame({}, 0);
    var before = JSON.stringify(st);
    E.legalActions(st, 'p0-8');
    E.reachable(st, 'p0-8');
    E.hasAnyAction(st);
    E.activatableKinds(st);
    E.usedKinds(st);
    E.canFireAgain(st, 'p0-8');
    E.piecesOf(st, 0);
    E.pieceAt(st, 0, 0);
    E.pieceStats(st.pieces['p0-8']);
    assertEqual(JSON.stringify(st), before);
  });

  /* ---------- report ---------- */

  lines.push('');
  lines.push(count + ' tests, ' + failures + ' failures');
  document.getElementById('out').textContent = lines.join('\n');
  document.title = failures === 0 ? 'PASS' : ('FAIL ' + failures);
})();
</script>
