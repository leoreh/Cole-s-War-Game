<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Game">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="War Game">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141821">
<title>War Game</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* =====================================================================
   War Game - all styles.
   Logical properties everywhere, so the interface mirrors in Hebrew.
   The board itself is always direction: ltr and never mirrors.

   Order: tokens, shell, stage and board, pieces, marks, panel, overlays
   (menu card, rules sheet, settings drawer, dialogs), form widgets,
   EFFECTS (the animations), THEME SHELL (the tone of the page and the
   panel per theme), THEME DECORATION (the board of each theme),
   motion switches.

   Every surface, every text color and every corner radius here is a token,
   so a theme block can turn the whole interface parchment, paper, neon or
   candy without touching the rules above it.
   ===================================================================== */

/* ------------------------------------------------------------- tokens -- */

:root {
  /* set from the settings by ui.js */
  --p0: #efe6cf;
  --p0-outline: #1b1d24;
  --p1: #2f3550;
  --p1-outline: #f5f3ee;
  --sq-light: #efe0c3;
  --sq-dark: #a97e57;

  /* the shell */
  --bg: #141821;
  --bg-2: #1e2230;
  --bg-3: #272c3c;
  --fg: #f3f2ef;
  --muted: #a3abbd;
  --line: rgba(255, 255, 255, 0.14);
  --accent: #6fa8ff;
  --accent-ink: #0b1220;
  --accent-soft: rgba(111, 168, 255, 0.34);
  --danger: #e75b4d;
  --danger-soft: rgba(231, 91, 77, 0.34);
  --fire: #eb9b26;
  --fire-soft: rgba(235, 155, 38, 0.34);
  --heal: #4fc38c;

  /* surfaces, text and shape - every theme block rewrites these */
  --fg-2: #e2e3e8;
  --soft: rgba(255, 255, 255, 0.055);
  --soft-2: rgba(255, 255, 255, 0.12);
  --card-bg: rgba(23, 27, 38, 0.92);
  --code-bg: #11141d;
  --scrim: rgba(8, 10, 16, 0.72);
  --btn-inset: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  --btn-drop: 0 1px 2px rgba(0, 0, 0, 0.3);
  --ov-shadow: 0 26px 70px rgba(0, 0, 0, 0.6);
  --r-btn: 12px;
  --r-pill: 999px;
  --r-card: 20px;
  --r-board: 16px;
  --app-bg: radial-gradient(120% 90% at 50% -10%, #1d2233 0%, var(--bg) 60%);
  --board-shadow:
    0 22px 50px -14px rgba(0, 0, 0, 0.72),
    0 0 0 1px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  --frame-mult: 0.019;
  --frame-max: 12px;

  /* the piece in its square and the badges on it */
  --pc-size: 80%;
  --pc-shadow: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
  --pc-shadow-hi: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.55));
  /* --badge-bg and --badge-fg are deliberately left unset: a badge falls back
     to the owner's own outline color, and only a theme that wants one fixed
     badge for both players sets them */
  --badge-ring: 0 0 0 1px rgba(0, 0, 0, 0.25);
  --badge-r: 999px;
  --hurt-bg: #e3a92f;
  --hurt-fg: #2a1a03;
  --str-bg: #7a1f1f;
  --str-fg: #ffe9e0;

  /* one family for every mark drawn on a square */
  --ring-w: calc(var(--sq) * 0.055);
  --ring-glow: calc(var(--sq) * 0.2);
  --dot-core: #fff;
  --dot-halo: rgba(0, 0, 0, 0.45);

  /* viewport in px, kept fresh by ui.js; the fallbacks work on their own */
  --vh: 100vh;
  --vw: 100vw;
  /* one board square in px, set by ui.js */
  --sq: 40px;

  /* room the panel takes beside the board and under it */
  --side-space: 330px;
  --below-space: 250px;

  --ov-fast: 0.16s;
  --ov-slow: 0.23s;
}

/* with no game running the board has the whole stage to itself */
body.no-game { --side-space: 48px; --below-space: 48px; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  overscroll-behavior: none;
}

#app {
  position: fixed;
  inset: 0;
  display: flex;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  padding-block-start: env(safe-area-inset-top);
  padding-block-end: env(safe-area-inset-bottom);
  padding-inline-start: env(safe-area-inset-left);
  padding-inline-end: env(safe-area-inset-right);
  background: var(--app-bg);
  transition: background 0.3s ease;
}

/* ------------------------------------------------------------ buttons -- */

.btn {
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  font-weight: 600;
  color: var(--fg);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  padding: 0.62em 1.05em;
  min-block-size: 44px;
  cursor: pointer;
  touch-action: manipulation;
  text-align: center;
  box-shadow: var(--btn-inset), var(--btn-drop);
  transition: background 0.15s ease, opacity 0.15s ease,
              box-shadow 0.15s ease, transform 0.11s ease;
}
.btn:hover { background: var(--bg-3); }
.btn:active {
  background: var(--bg-3);
  transform: translateY(1px);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.32; cursor: default; transform: none; box-shadow: none; }
.btn--primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
  font-weight: 700;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.35),
    0 6px 16px -7px var(--accent-soft);
}
.btn--primary:hover { filter: brightness(1.12); }
.btn--heal {
  background: var(--heal);
  color: #06231a;
  border-color: transparent;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.3),
    0 6px 16px -7px rgba(79, 195, 140, 0.8);
}
.btn--wide { inline-size: 100%; }
.btn--small { min-block-size: 38px; padding: 0.42em 0.85em; font-size: 0.92rem; }
.btn--small.is-on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.iconbtn {
  appearance: none;
  -webkit-appearance: none;
  flex: 0 0 auto;
  inline-size: 36px;
  block-size: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  color: var(--fg);
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: calc(var(--r-btn) - 2px);
  cursor: pointer;
  transition: background 0.15s ease, transform 0.12s ease;
}
.iconbtn:hover { background: var(--soft-2); transform: translateY(-1px); }
.iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.iconbtn svg { inline-size: 21px; block-size: 21px; display: block; }

.lang-switch { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.lang-btn {
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  font-weight: 600;
  color: var(--fg);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  padding: 0.45em 1.1em;
  min-block-size: 40px;
  cursor: pointer;
  box-shadow: var(--btn-inset);
}
.lang-btn.is-on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* --------------------------------------------------- stage and board --- */

.stage {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 10px;
  min-inline-size: 0;
  min-block-size: 0;
  overflow: hidden;
}

.board-wrap {
  --board-size: max(180px, min(calc(var(--vh) - 24px), calc(var(--vw) - var(--side-space))));
  flex: 0 0 auto;
  inline-size: var(--board-size);
  block-size: var(--board-size);
  /* no transition on the size: ui.js measures the square from the board and
     a size in flight would leave --sq behind */
}

.board {
  /* the frame is the border: the squares fill the padding box, so the
     square size ui.js measures stays the width of the grid itself */
  --frame-w: clamp(4px, calc(var(--board-size, 480px) * var(--frame-mult)), var(--frame-max));
  position: relative;
  direction: ltr;
  inline-size: 100%;
  block-size: 100%;
  border: var(--frame-w) solid transparent;
  border-radius: var(--r-board);
  /* the frame is the transparent border: every background layer is laid out
     over the border box, so a theme can decorate the band itself */
  background-origin: border-box;
  background-clip: border-box;
  background-image: linear-gradient(155deg, #4a5166 0%, #262c3c 46%, #151925 100%);
  overflow: hidden;
  box-shadow: var(--board-shadow);
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* the board sinks into its frame */
.board::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  box-shadow: var(--board-sink,
    inset 0 0 0 1px rgba(0, 0, 0, 0.38),
    inset 0 7px 12px -8px rgba(0, 0, 0, 0.75),
    inset 0 -7px 12px -8px rgba(0, 0, 0, 0.45));
}

.squares {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
}

/* the one overlay drawn over the whole grid and under the pieces: the
   vignette, the grain, the scanlines - each theme fills it in. It is taken
   out of the grid flow, so it never counts as a ninth column. */
.squares::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: var(--board-veil, none);
  mix-blend-mode: var(--board-veil-blend, normal);
  opacity: var(--board-veil-op, 1);
}

.sq { position: relative; }
.sq--light { background: var(--sq-light); }
.sq--dark { background: var(--sq-dark); }

/* the stack inside the board, from the squares up:
   1 the theme veil over the grid, 2 the pieces, 3 the marks, 4 the effects,
   5 the theme's veil over everything, 6 the frame's inner bevel, 7 the ribbon */
.layer { position: absolute; inset: 0; pointer-events: none; }
.pieces { z-index: 2; }
.marks { z-index: 3; }
.fx { z-index: 4; }

/* the theme's overlay above the pieces: scanlines, bloom, a vignette */
.board::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: var(--board-over, none);
  mix-blend-mode: var(--board-over-blend, normal);
  opacity: var(--board-over-op, 1);
}

/* with no game on it the board is only a backdrop */
body.no-game .board { pointer-events: none; }
body.no-game .pieces { opacity: 0.55; filter: saturate(0.85); }

/* coordinates */
.coord {
  position: absolute;
  font-size: calc(var(--sq) * 0.16);
  font-weight: 600;
  letter-spacing: 0.02em;
  line-height: 1;
  opacity: 0.45;
  pointer-events: none;
  z-index: 2;
}
.coord--file { inset-block-end: 6%; inset-inline-end: 8%; }
.coord--rank { inset-block-start: 6%; inset-inline-start: 8%; }
.sq--light .coord { color: rgba(0, 0, 0, 0.8); }
.sq--dark .coord { color: rgba(255, 255, 255, 0.9); }
.board:not(.board--coords) .coord { display: none; }

/* selection and the pieces that may still act */
.sq--sel {
  z-index: 2;
  box-shadow:
    inset 0 0 0 var(--ring-w) var(--accent),
    inset 0 0 var(--ring-glow) var(--accent-soft),
    inset 0 0 0 calc(var(--ring-w) + 1px) rgba(0, 0, 0, 0.35);
}
/* on a pointer device, hovering a piece that may still act rings it */
@media (hover: hover) {
  .sq--act:hover::after {
    content: "";
    position: absolute;
    inset: 7%;
    pointer-events: none;
    border-radius: 50%;
    box-shadow:
      inset 0 0 0 calc(var(--ring-w) * 0.55) rgba(255, 255, 255, 0.55),
      inset 0 0 var(--ring-glow) rgba(255, 255, 255, 0.18),
      inset 0 0 0 calc(var(--ring-w) * 0.55 + 1px) rgba(0, 0, 0, 0.28);
  }
}

/* ------------------------------------------------------------- pieces -- */

.pc {
  position: absolute;
  inset-block-start: 0;
  left: 0;
  inline-size: 12.5%;
  block-size: 12.5%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.24s cubic-bezier(0.34, 0.72, 0.28, 1), opacity 0.2s linear;
}
.pc--used .piece { opacity: 0.42; filter: saturate(0.55) brightness(0.92); }

.piece {
  position: relative;
  display: block;
  inline-size: var(--pc-size);
  block-size: var(--pc-size);
  filter: var(--pc-shadow);
  transition: transform 0.15s cubic-bezier(0.3, 1.3, 0.5, 1), filter 0.15s ease;
}
.piece[data-owner="0"] { color: var(--p0); --piece-outline: var(--p0-outline); }
.piece[data-owner="1"] { color: var(--p1); --piece-outline: var(--p1-outline); }

.glyph { display: block; inline-size: 100%; block-size: 100%; overflow: visible; }
.piece > .glyph { position: absolute; inset: 0; }

.piece-sub {
  position: absolute;
  inset-block-start: -7%;
  inset-inline-end: -7%;
  inline-size: 44%;
  block-size: 44%;
}

/* the bow of a piece that moved one step and kept its shot */
.piece-bow {
  position: absolute;
  inset-block-start: -6%;
  inset-inline-start: -6%;
  inline-size: 38%;
  block-size: 38%;
  color: var(--fire);
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.75));
}
.piece-bow svg { inline-size: 100%; block-size: 100%; display: block; }

/* the health badge at the bottom, the strength badge beside it */
.badge {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.1em;
  padding: 0 0.32em;
  min-inline-size: 36%;
  block-size: 33%;
  border-radius: var(--badge-r);
  background: var(--badge-bg, var(--piece-outline, #171a22));
  color: var(--badge-fg, currentColor);
  box-shadow: var(--badge-ring);
  font-size: calc(var(--sq) * 0.195);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.badge--hp { inset-block-end: -8%; inset-inline-start: -8%; }
.badge--hurt {
  background: var(--hurt-bg);
  color: var(--hurt-fg);
  box-shadow: var(--badge-ring), var(--hurt-glow, 0 0 0 0 transparent);
  animation: hurtBeat 2.1s ease-in-out infinite;
}
.badge--str {
  inset-block-end: -8%;
  inset-inline-end: -8%;
  background: var(--str-bg);
  color: var(--str-fg);
  padding: 0 0.24em;
}
.badge .mark-ico {
  inline-size: 0.95em;
  block-size: 0.95em;
  display: block;
  flex: 0 0 auto;
}

/* -------------------------------------------------------- move marks --- */

.mark {
  position: absolute;
  inset-block-start: 0;
  left: 0;
  inline-size: 12.5%;
  block-size: 12.5%;
}
/* one family: a dot with a dark halo so it reads on a pale square and on a
   dark one alike, and two rings of the same weight over it */
.mark--move::after {
  content: "";
  position: absolute;
  inset: 37%;
  border-radius: 50%;
  background: var(--dot-core);
  box-shadow:
    0 0 0 calc(var(--sq) * 0.022) var(--dot-halo),
    0 0 var(--ring-glow) var(--dot-glow, rgba(255, 255, 255, 0.38)),
    0 1px 3px rgba(0, 0, 0, 0.45);
}
.mark--attack::after,
.mark--fire::after {
  content: "";
  position: absolute;
  inset: 7%;
  border-radius: 50%;
  border: var(--ring-w) solid var(--danger);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.35),
    0 0 var(--ring-glow) var(--danger-soft),
    inset 0 0 var(--ring-glow) var(--danger-soft);
  animation: ringBreathe 1.6s ease-in-out infinite;
}
.mark--fire::after {
  border-color: var(--fire);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.35),
    0 0 var(--ring-glow) var(--fire-soft),
    inset 0 0 var(--ring-glow) var(--fire-soft);
  animation-duration: 1.25s;
}
.bowmark {
  position: absolute;
  inset-block-start: 2%;
  inset-inline-end: 2%;
  inline-size: 32%;
  block-size: 32%;
  color: var(--fire);
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
  /* the bow itself takes the tap, so a target that may be both attacked and
     fired at still offers the two */
  pointer-events: auto;
  cursor: pointer;
}
.bowmark svg { inline-size: 100%; block-size: 100%; display: block; }

.heal-btn {
  position: absolute;
  inset-block-start: 0;
  left: 0;
  inline-size: 12.5%;
  block-size: 12.5%;
  /* only the pill takes the tap, so the rest of the square still deselects */
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-block-end: 2%;
  background: none;
  border: 0;
  cursor: pointer;
}
.heal-btn span {
  display: block;
  pointer-events: auto;
  padding: 0.15em 0.55em;
  border-radius: 999px;
  background: var(--heal);
  color: #06231a;
  font-size: calc(var(--sq) * 0.24);
  font-weight: 800;
  line-height: 1.5;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  white-space: nowrap;
}

/* ---------------------------------------------------------- the panel -- */

.panel {
  flex: 0 1 300px;
  min-inline-size: 200px;
  max-inline-size: 330px;
  max-block-size: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
  overflow-y: auto;
}
.panel[hidden] { display: none; }

.panel-top { display: flex; flex-direction: column; gap: 12px; }

.turn-line {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  padding: 9px 11px;
  font-weight: 700;
  box-shadow: var(--btn-inset), 0 2px 10px -6px rgba(0, 0, 0, 0.8);
}
.turn-name { flex: 1 1 auto; min-inline-size: 0; }
.turn-number { color: var(--muted); font-weight: 600; font-size: 0.9rem; }

.swatch {
  display: inline-block;
  inline-size: 1.25em;
  block-size: 1.25em;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  flex: 0 0 auto;
}
.swatch--big {
  inline-size: 56px;
  block-size: 56px;
  border-radius: 16px;
  margin-inline: auto;
}

.combo { display: flex; flex-direction: column; gap: 8px; }
.combo-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.combo-label { color: var(--muted); font-size: 0.85rem; min-inline-size: 5.5em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px 4px 6px;
  border-radius: var(--r-pill);
  background: var(--soft);
  border: 1px solid var(--line);
  font-size: 0.85rem;
  font-weight: 600;
}
[dir="rtl"] .chip { padding: 4px 6px 4px 10px; }
.chip--dim { opacity: 0.4; }
.chip-ico {
  position: relative;
  display: block;
  inline-size: 1.65em;
  block-size: 1.65em;
  flex: 0 0 auto;
  color: var(--ico-fg, var(--fg));
  --piece-outline: var(--ico-outline, rgba(0, 0, 0, 0.6));
}

.panel-msg {
  margin: 0;
  min-block-size: 1.3em;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.35;
}

.panel-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.panel-actions .btn { flex: 1 1 45%; }
.panel-actions .btn--primary { flex: 1 1 100%; }
.panel-actions .btn--heal { flex: 1 1 100%; }

/* ------------------------------------------------- portrait and phone -- */

@media (orientation: portrait) {
  .stage { flex-direction: column; gap: 10px; }
  .board-wrap {
    --board-size: max(180px, min(calc(var(--vw) - 20px), calc(var(--vh) - var(--below-space))));
  }
  .panel {
    flex: 0 0 auto;
    inline-size: min(100%, 560px);
    max-inline-size: none;
  }
  .panel-actions .btn { flex: 1 1 22%; }
  .panel-actions .btn--primary { flex: 1 1 22%; }
}

/* a phone: the board takes the width, the panel is a bar under it */
@media (max-width: 600px) {
  :root { --below-space: 200px; }
  body.no-game { --below-space: 30px; }
  .stage { flex-direction: column; gap: 6px; padding: 4px; }
  .board-wrap {
    --board-size: max(160px, min(calc(var(--vw) - 8px), calc(var(--vh) - var(--below-space))));
  }
  /* a phone keeps each theme's character, only smaller */
  .board { border-radius: min(var(--r-board), 16px); }
  .panel {
    flex: 0 0 auto;
    inline-size: 100%;
    max-inline-size: none;
    gap: 6px;
  }
  .panel-top { gap: 6px; }
  .turn-line { padding: 6px 9px; border-radius: 11px; font-size: 0.92rem; }
  .iconbtn { inline-size: 32px; block-size: 32px; }
  .combo { flex-direction: row; gap: 10px; flex-wrap: wrap; }
  .combo-label { min-inline-size: 0; }
  .chip { font-size: 0.78rem; padding: 2px 8px 2px 4px; }
  [dir="rtl"] .chip { padding: 2px 4px 2px 8px; }
  .chip-ico { inline-size: 1.4em; block-size: 1.4em; }
  .panel-msg { font-size: 0.82rem; min-block-size: 1.1em; }
  .panel-actions { gap: 6px; }
  .panel-actions .btn,
  .panel-actions .btn--primary,
  .panel-actions .btn--heal {
    flex: 1 1 22%;
    min-block-size: 40px;
    padding: 0.4em 0.5em;
    font-size: 0.88rem;
    border-radius: 10px;
  }
}

/* ---------------------------------------------------------- overlays --- */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  opacity: 0;
  transition: opacity var(--ov-slow) ease;
}
.overlay.is-open { opacity: 1; }
.overlay[hidden] { display: none; }
/* the menu waits behind a sheet, a drawer or a dialog opened from it */
.overlay--menu.is-under { opacity: 0; pointer-events: none; }

/* the card of the menu and the dialogs */
.card-pop,
.dialog {
  transform: translateY(12px) scale(0.965);
  transition: transform var(--ov-slow) cubic-bezier(0.18, 0.9, 0.28, 1.08);
}
.overlay.is-open .card-pop,
.overlay.is-open .dialog { transform: none; }

.menu {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 18px;
  inline-size: min(380px, 100%);
  max-block-size: 100%;
  overflow-y: auto;
  text-align: center;
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: calc(var(--r-card) + 2px);
  padding: 22px 20px;
  box-shadow: var(--ov-shadow);
}
.menu-title {
  margin: 0;
  font-size: clamp(1.7rem, 6vw, 2.6rem);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--title-fg, var(--fg));
  text-shadow: var(--title-shadow, none);
}
.menu-buttons { display: flex; flex-direction: column; gap: 10px; }
.menu-buttons[hidden] { display: none; }
.menu-confirm { display: flex; flex-direction: column; gap: 10px; }
.menu-confirm[hidden] { display: none; }
.menu-confirm p { margin: 0 0 2px; color: var(--muted); font-size: 0.95rem; }

/* the rules sheet */
.overlay--sheet { padding: 12px; }
.sheet {
  inline-size: min(760px, 100%);
  max-block-size: min(88vh, calc(var(--vh) - 40px));
  display: flex;
  flex-direction: column;
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  overflow: hidden;
  box-shadow: var(--ov-shadow);
  transform: translateY(16px);
  opacity: 0.6;
  transition: transform var(--ov-slow) cubic-bezier(0.2, 0.8, 0.3, 1),
              opacity var(--ov-slow) ease;
}
.overlay--sheet.is-open .sheet { transform: none; opacity: 1; }

.sheet-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-block-end: 1px solid var(--line);
  flex: 0 0 auto;
}
.sheet-head h2 { margin: 0; font-size: 1.1rem; flex: 1 1 auto; }

.doc-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 18px 30px;
}
.doc-body h3 {
  margin: 1.4em 0 0.4em;
  font-size: 1.08rem;
  color: var(--accent);
}
.doc-body h3:first-child { margin-block-start: 0.2em; }
.doc-body p { margin: 0 0 0.7em; line-height: 1.7; color: var(--fg-2); text-align: start; }
.doc-body ul { margin: 0 0 1em; padding-inline-start: 1.25em; line-height: 1.7; color: var(--fg-2); }
.doc-body li { margin-block-end: 0.25em; }

.rules-table { inline-size: 100%; border-collapse: collapse; margin: 0.3em 0 1em; }
.rules-table th,
.rules-table td {
  text-align: start;
  padding: 8px 8px;
  border-block-end: 1px solid var(--line);
}
.rules-table th { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
.rules-table .num { text-align: center; font-variant-numeric: tabular-nums; }
.rules-table .cell-piece { display: flex; align-items: center; gap: 8px; font-weight: 600; }
/* six columns fit a phone only this tight */
@media (max-width: 600px) {
  .rules-table th,
  .rules-table td { padding: 8px 4px; }
  .rules-table .cell-piece { gap: 5px; }
}

.combo-list { display: flex; flex-direction: column; gap: 7px; margin: 0.3em 0 1em; }
.combo-item {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  padding: 8px 10px;
}
.combo-plus { color: var(--muted); }

/* the settings drawer: from the inline end in landscape, from the bottom
   in portrait, always over the panel and never over the whole board */
.overlay--drawer {
  padding: 0;
  align-items: stretch;
  justify-content: flex-end;
  background: rgba(8, 10, 16, 0.38);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.drawer {
  inline-size: min(420px, 100%);
  max-block-size: 100%;
  display: flex;
  flex-direction: column;
  background: var(--card-bg);
  border-inline-start: 1px solid var(--line);
  box-shadow: -18px 0 50px rgba(0, 0, 0, 0.5);
  transform: translateX(100%);
  transition: transform var(--ov-slow) cubic-bezier(0.2, 0.86, 0.3, 1);
}
[dir="rtl"] .drawer { transform: translateX(-100%); box-shadow: 18px 0 50px rgba(0, 0, 0, 0.5); }
.overlay--drawer.is-open .drawer { transform: none; }

.drawer-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 30px;
}

@media (orientation: portrait) {
  .overlay--drawer { align-items: flex-end; justify-content: stretch; }
  .drawer {
    inline-size: 100%;
    max-block-size: min(82vh, calc(var(--vh) - 60px));
    border-inline-start: 0;
    border-block-start: 1px solid var(--line);
    border-start-start-radius: 20px;
    border-start-end-radius: 20px;
    box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.5);
    transform: translateY(100%);
  }
  [dir="rtl"] .drawer { transform: translateY(100%); box-shadow: 0 -18px 50px rgba(0, 0, 0, 0.5); }
}

/* the dialogs */
.dialog {
  inline-size: min(430px, 100%);
  max-block-size: 100%;
  overflow-y: auto;
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: center;
  box-shadow: var(--ov-shadow);
}
.dialog h2 { margin: 0; font-size: 1.25rem; }
.dialog p { margin: 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5; }

.merge-piece {
  position: relative;
  inline-size: 92px;
  block-size: 92px;
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  --sq: 92px;
}
.merge-choices { display: flex; gap: 8px; }
.merge-choice {
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  color: var(--fg);
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 6px;
  border-radius: var(--r-btn);
  border: 1px solid var(--line);
  background: var(--soft);
  cursor: pointer;
  transition: background 0.14s ease, transform 0.14s ease;
}
.merge-choice:hover { background: var(--soft-2); transform: translateY(-2px); }
.merge-choice .chip-ico {
  inline-size: 44px;
  block-size: 44px;
  color: var(--p-cur, var(--fg));
  --piece-outline: var(--p-cur-outline, rgba(0, 0, 0, 0.6));
}
.merge-name { font-weight: 700; font-size: 0.95rem; }
.merge-stats {
  font-size: 0.74rem;
  color: var(--muted);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}

.invite-text {
  text-align: start;
  white-space: pre-wrap;
  word-break: break-word;
  max-block-size: 40vh;
  overflow-y: auto;
  margin: 0;
}
.row--center { justify-content: center; }

/* --------------------------------------------------- the form widgets -- */

.card {
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  padding: 14px;
  margin-block-end: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card h3 { margin: 0; font-size: 1rem; color: var(--fg); }
.card h4 {
  margin: 0.3em 0 -0.2em;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted);
}

.themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.theme-btn {
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  color: var(--fg);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  padding: 6px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  transition: transform 0.14s ease, box-shadow 0.14s ease;
}
.theme-btn:hover { transform: translateY(-2px); }
.theme-btn.is-on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.theme-view {
  position: relative;
  inline-size: 100%;
  block-size: 42px;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
}
.theme-piece {
  position: relative;
  flex: 1 1 50%;
  display: block;
  padding: 4px;
}
.theme-piece svg { inline-size: 100%; block-size: 100%; display: block; }
.theme-name { font-size: 0.8rem; font-weight: 600; }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  padding: 8px 10px;
  font-size: 0.9rem;
}
.field input[type="color"] {
  inline-size: 56px;
  block-size: 34px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: none;
  cursor: pointer;
  flex: 0 0 auto;
}

.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.95rem; }
.switch input { inline-size: 22px; block-size: 22px; accent-color: var(--accent); flex: 0 0 auto; }

.presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.preset {
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  font-weight: 600;
  color: var(--fg);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--r-btn);
  padding: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  min-block-size: 44px;
  font-size: 0.9rem;
  transition: transform 0.14s ease;
}
.preset:hover { transform: translateY(-2px); }
.preset-swatches { display: flex; flex: 0 0 auto; border-radius: 6px; overflow: hidden; }
.preset-swatches i { inline-size: 12px; block-size: 22px; display: block; }

.note { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
.note--live { min-block-size: 1.2em; color: var(--accent); }

.code {
  inline-size: 100%;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 0.8rem;
  line-height: 1.4;
  color: var(--fg);
  background: var(--code-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
  resize: vertical;
  word-break: break-all;
}
.row { display: flex; gap: 8px; flex-wrap: wrap; }

/* =====================================================================
   EFFECTS - every animation of the game lives in this block.
   Each one is driven by a small function in ui.js; the looks are here.
   Nothing runs longer than about 600 ms, so a turn on an iPad never waits
   for the screen. A theme colours an effect through the --fx-* tokens it
   sets in its own block further down.
   ===================================================================== */

.fx { overflow: hidden; }

/* --- the piece itself ------------------------------------------------- */

/* the piece that is moving lifts off the board */
.pc--moving { z-index: 4; }
.pc--moving .piece {
  animation: none;
  transform: translateY(-10%) scale(1.09);
  filter: var(--pc-shadow-move, drop-shadow(0 9px 10px rgba(0, 0, 0, 0.55)));
}

/* the selected piece bobs, with a little sway so it reads as alive */
.pc--sel { z-index: 3; }
.pc--sel .piece { animation: bob 1.25s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  32% { transform: translateY(-9%) rotate(-2deg); }
  66% { transform: translateY(-3%) rotate(2deg); }
}

/* a piece that took a hit shakes */
.pc--shake { z-index: 4; }
.pc--shake .piece { animation: shake 0.28s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
@keyframes shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  16% { transform: translateX(-12%) rotate(-6deg); }
  38% { transform: translateX(10%) rotate(5deg); }
  62% { transform: translateX(-6%) rotate(-3deg); }
  84% { transform: translateX(3%) rotate(1deg); }
}

/* the merged piece scales in past its size and settles */
.pc--pop { z-index: 4; }
.pc--pop .piece { animation: pop 0.42s cubic-bezier(0.2, 1.6, 0.35, 1); }
@keyframes pop {
  0% { transform: scale(0.3) rotate(-14deg); opacity: 0.3; }
  55% { transform: scale(1.16) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

/* the bow of a kept shot pulses */
.piece-bow { animation: bowPulse 1.2s ease-in-out infinite; }
@keyframes bowPulse {
  0%, 100% { opacity: 0.7; transform: scale(0.93); }
  50% { opacity: 1; transform: scale(1.17); }
}

/* the amber badge of a hurt piece beats, so a wound is never missed */
@keyframes hurtBeat {
  0%, 82%, 100% { transform: scale(1); }
  88% { transform: scale(1.16); }
  94% { transform: scale(0.97); }
}

/* hover on a pointer device lifts the piece */
@media (hover: hover) {
  .pc:hover { z-index: 3; }
  .pc:hover .piece {
    transform: translateY(-8%) scale(1.07);
    filter: var(--pc-shadow-hi);
  }
}

/* --- the marks on the squares ----------------------------------------- */

/* the dots of the legal squares pulse, out of step with each other */
.mark--move::after { animation: dotPulse 1.5s ease-in-out infinite; }
.mark--move:nth-child(2n)::after { animation-delay: -0.35s; }
.mark--move:nth-child(3n)::after { animation-delay: -0.7s; }
.mark--move:nth-child(5n)::after { animation-delay: -1.05s; }
@keyframes dotPulse {
  0%, 100% { transform: scale(0.78); opacity: 0.68; }
  50% { transform: scale(1.16); opacity: 1; }
}

/* the attack and fire rings breathe on the same beat */
@keyframes ringBreathe {
  0%, 100% { transform: scale(0.95); }
  50% { transform: scale(1.04); }
}

/* --- what the effects layer draws -------------------------------------- */

/* floating numbers: a quick pop up, then the drift */
.float {
  position: absolute;
  font-weight: 800;
  font-size: calc(var(--sq) * 0.42);
  line-height: 1;
  color: #fff;
  text-shadow:
    0 1px 3px rgba(0, 0, 0, 0.85),
    0 0 calc(var(--sq) * 0.09) rgba(0, 0, 0, 0.55);
  animation: floatUp 0.72s cubic-bezier(0.14, 0.86, 0.3, 1) forwards;
  white-space: nowrap;
  filter: var(--fx-glow, none);
}
.float--loss { color: var(--fx-loss, #ff8d7f); }
.float--heal { color: var(--fx-heal-num, #7bf0bb); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -18%) scale(0.55); }
  24% { opacity: 1; transform: translate(-50%, -78%) scale(1.18); }
  42% { transform: translate(-50%, -98%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -190%) scale(0.92); }
}

/* the arrow: fletching, an arc across the shot, turning into its flight */
.arrow {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 50% 50%;
  animation: arrowFly 0.3s cubic-bezier(0.4, 0.05, 0.7, 0.6) forwards;
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.55)) var(--fx-glow, none);
}
.arrow svg { inline-size: 100%; block-size: 100%; display: block; }
@keyframes arrowFly {
  0% {
    transform: translate(var(--x0), var(--y0))
               rotate(calc(var(--ang) - 17deg)) scale(0.7);
    opacity: 0;
  }
  12% { opacity: 1; }
  50% { transform: translate(var(--xm), var(--ym)) rotate(var(--ang)) scale(1); }
  100% {
    transform: translate(var(--x1), var(--y1))
               rotate(calc(var(--ang) + 15deg)) scale(1);
    opacity: 1;
  }
}

/* the burst where the arrow lands */
.burst {
  position: absolute;
  inline-size: calc(var(--sq) * 0.78);
  block-size: calc(var(--sq) * 0.78);
  margin-inline-start: calc(var(--sq) * -0.39);
  margin-block-start: calc(var(--sq) * -0.39);
  border-radius: 50%;
  background: var(--fx-burst, radial-gradient(circle,
    rgba(255, 244, 214, 0.98) 0%,
    rgba(235, 155, 38, 0.65) 42%,
    rgba(235, 155, 38, 0) 70%));
  animation: burstOut 0.36s cubic-bezier(0.15, 0.6, 0.35, 1) forwards;
}
@keyframes burstOut {
  0% { transform: scale(0.3); opacity: 0.35; }
  18% { opacity: 1; }
  58% { opacity: 0.85; }
  100% { transform: scale(1.8); opacity: 0; }
}

/* the sword clash of a melee attack: a white flash and a ring of light */
.clash {
  position: absolute;
  inline-size: calc(var(--sq) * 0.9);
  block-size: calc(var(--sq) * 0.9);
  margin-inline-start: calc(var(--sq) * -0.45);
  margin-block-start: calc(var(--sq) * -0.45);
  border-radius: 50%;
  background: var(--fx-clash, radial-gradient(circle,
    rgba(255, 255, 255, 0.98) 0%,
    rgba(255, 220, 140, 0.75) 36%,
    rgba(255, 210, 120, 0) 70%));
  animation: clashOut 0.38s cubic-bezier(0.15, 0.6, 0.35, 1) forwards;
}
@keyframes clashOut {
  0% { transform: scale(0.3) rotate(-16deg); opacity: 0.25; }
  15% { opacity: 1; }
  55% { opacity: 0.85; }
  100% { transform: scale(1.75) rotate(12deg); opacity: 0; }
}

/* the square that was hit flashes white for a moment */
.flash {
  position: absolute;
  inline-size: var(--sq);
  block-size: var(--sq);
  margin-inline-start: calc(var(--sq) * -0.5);
  margin-block-start: calc(var(--sq) * -0.5);
  border-radius: 12%;
  background: var(--fx-flash, radial-gradient(circle,
    rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 68%));
  animation: flashOut 0.28s ease-out forwards;
}
@keyframes flashOut {
  0% { opacity: 0; transform: scale(0.72); }
  20% { opacity: 0.95; }
  60% { opacity: 0.6; }
  100% { opacity: 0; transform: scale(1.16); }
}

/* sparks of a clash and of a merge */
.spark {
  position: absolute;
  inline-size: calc(var(--sq) * 0.12);
  block-size: calc(var(--sq) * 0.12);
  border-radius: 50%;
  box-shadow: var(--fx-spark-glow, none);
  animation: sparkOut 0.5s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
}
@keyframes sparkOut {
  0% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
  58% { opacity: 0.95; }
  100% {
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.18);
    opacity: 0;
  }
}

/* the fragments a dead piece breaks into */
.frag {
  position: absolute;
  inline-size: var(--fs, 6px);
  block-size: var(--fs, 6px);
  border-radius: var(--fx-frag-r, 2px);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), var(--fx-frag-glow, 0 0 0 0 transparent);
  animation: fragFall 0.56s cubic-bezier(0.4, 0, 0.75, 0.5) forwards;
}
@keyframes fragFall {
  0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.1); opacity: 1; }
  25% {
    transform: translate(calc(-50% + var(--dx) * 0.45), calc(-50% - var(--sq) * 0.12))
               rotate(calc(var(--rot) * 0.3)) scale(1);
    opacity: 1;
  }
  100% {
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
               rotate(var(--rot)) scale(0.85);
    opacity: 0;
  }
}

/* the heal pulse and its sparkles */
.ring {
  position: absolute;
  border-radius: 50%;
  border: calc(var(--sq) * 0.06) solid var(--heal);
  box-shadow: 0 0 calc(var(--sq) * 0.2) var(--heal);
  animation: ringPulse 0.52s cubic-bezier(0.15, 0.65, 0.3, 1) forwards;
}
@keyframes ringPulse {
  0% { transform: scale(0.3); opacity: 1; }
  55% { opacity: 0.8; }
  100% { transform: scale(1.45); opacity: 0; }
}
.sparkle {
  position: absolute;
  inline-size: calc(var(--sq) * 0.13);
  block-size: calc(var(--sq) * 0.13);
  background: radial-gradient(circle, #e8fff5 0%, var(--heal) 58%, rgba(79, 195, 140, 0) 74%);
  border-radius: 50%;
  animation: sparkleUp 0.6s ease-out forwards;
}
@keyframes sparkleUp {
  0% { transform: translate(-50%, -50%) scale(0.35); opacity: 0; }
  28% { opacity: 1; transform: translate(-50%, calc(-50% - var(--sq) * 0.25)) scale(1.15); }
  100% { transform: translate(-50%, calc(-50% - var(--sq) * 0.85)) scale(0.6); opacity: 0; }
}

/* the turn ribbon */
.ribbon {
  position: absolute;
  inset-block-start: 41%;
  left: 0;
  right: 0;
  block-size: 18%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--sq) * 0.5);
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  z-index: 7;
  box-shadow:
    0 6px 24px rgba(0, 0, 0, 0.45),
    inset 0 0 0 1px rgba(255, 255, 255, 0.22);
}
/* the sheen over whatever colour ui.js paints it */
.ribbon::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(255, 255, 255, 0.34) 0%,
    rgba(255, 255, 255, 0.04) 46%,
    rgba(0, 0, 0, 0.22) 100%);
}
.ribbon span { position: relative; letter-spacing: 0.02em; }
.ribbon.is-on { animation: ribbonSweep 0.56s cubic-bezier(0.22, 0.9, 0.28, 1); }
@keyframes ribbonSweep {
  0% { opacity: 0; transform: translateX(-32%) skewX(-11deg); }
  22% { opacity: 1; transform: translateX(0) skewX(0deg); }
  70% { opacity: 1; transform: translateX(0) skewX(0deg); }
  100% { opacity: 0; transform: translateX(28%) skewX(9deg); }
}

/* =====================================================================
   THEME DECORATION - the board of each theme. The user's square colors
   stay the base color of every square; all of this is an overlay at a low
   opacity over them, so a chosen color still reads.

   Each theme fills four slots: the board's own background (the frame),
   --board-veil (over the grid, under the pieces), --board-over (over the
   pieces) and .sq::before (the texture of one square).
   ===================================================================== */

.sq::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* --- classic: a planked wood frame with brass corner studs ------------- */
.board.theme-classic {
  --frame-mult: 0.029;
  --frame-max: 19px;
  --r-board: 12px;
  /* brass: a plate at each corner and studs down each band, then two passes
     of grain, then the plank itself */
  background-image:
    radial-gradient(circle at 0 0, #f4dda8 0 18%, #d9b264 34%, #9d7526 46%, rgba(26, 14, 4, 0.9) 50%, rgba(0, 0, 0, 0) 54%),
    radial-gradient(circle at 100% 0, #f4dda8 0 18%, #d9b264 34%, #9d7526 46%, rgba(26, 14, 4, 0.9) 50%, rgba(0, 0, 0, 0) 54%),
    radial-gradient(circle at 0 100%, #f4dda8 0 18%, #d9b264 34%, #9d7526 46%, rgba(26, 14, 4, 0.9) 50%, rgba(0, 0, 0, 0) 54%),
    radial-gradient(circle at 100% 100%, #f4dda8 0 18%, #d9b264 34%, #9d7526 46%, rgba(26, 14, 4, 0.9) 50%, rgba(0, 0, 0, 0) 54%),
    var(--stud), var(--stud), var(--stud), var(--stud),
    repeating-linear-gradient(93deg,
      rgba(0, 0, 0, 0.26) 0 2px,
      rgba(255, 224, 170, 0.07) 2px 4px,
      rgba(0, 0, 0, 0.12) 4px 7px),
    repeating-linear-gradient(87deg,
      rgba(0, 0, 0, 0.14) 0 6px, rgba(255, 255, 255, 0.04) 6px 13px),
    linear-gradient(152deg, #7d5732 0%, #543a21 46%, #2a1b10 100%);
  --stud: radial-gradient(circle closest-side at 50% 46%,
    #ffeec2 0 11%, #e0bc73 26%, #a8802f 40%, rgba(30, 16, 4, 0.7) 48%,
    rgba(0, 0, 0, 0) 56%);
  --stud-run: calc(var(--frame-w) * 2.9);
  --corner: calc(var(--frame-w) * 2.3);
  background-size:
    var(--corner) var(--corner),
    var(--corner) var(--corner),
    var(--corner) var(--corner),
    var(--corner) var(--corner),
    var(--stud-run) var(--frame-w),
    var(--stud-run) var(--frame-w),
    var(--frame-w) var(--stud-run),
    var(--frame-w) var(--stud-run),
    auto, auto, auto;
  background-position:
    left top, right top, left bottom, right bottom,
    center top, center bottom, left center, right center, 0 0, 0 0, 0 0;
  background-repeat:
    no-repeat, no-repeat, no-repeat, no-repeat,
    repeat-x, repeat-x, repeat-y, repeat-y, repeat, repeat, no-repeat;
  --board-shadow:
    0 24px 52px -14px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 226, 170, 0.18);
  --board-sink:
    inset 0 0 0 1px rgba(246, 214, 148, 0.4),
    inset 0 0 0 2px rgba(0, 0, 0, 0.5),
    inset 0 9px 14px -11px rgba(0, 0, 0, 0.85),
    inset 0 -9px 14px -11px rgba(0, 0, 0, 0.55);
  --board-veil: radial-gradient(128% 128% at 50% 42%,
    rgba(0, 0, 0, 0) 50%, rgba(42, 22, 6, 0.32) 100%);
}

      rgba(255, 255, 255, 0.055) 1px 3px,
      rgba(92, 56, 20, 0.05) 3px 6px),
    radial-gradient(135% 105% at 32% -5%,
      rgba(255, 255, 255, 0.16) 0%, rgba(0, 0, 0, 0) 58%);

.board.theme-heraldic {
  --frame-mult: 0.034;
  --frame-max: 23px;
  --r-board: 10px;
  background-image:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='none' stroke='%23eec87a' stroke-width='1.5' opacity='.8'><path d='M12 1.2 22.8 12 12 22.8 1.2 12Z'/><path d='M12 6.5 17.5 12 12 17.5 6.5 12Z'/></g><circle cx='12' cy='12' r='2' fill='%23eec87a' opacity='.9'/><circle cx='0' cy='0' r='1.6' fill='%23f5dda2' opacity='.7'/><circle cx='24' cy='0' r='1.6' fill='%23f5dda2' opacity='.7'/><circle cx='0' cy='24' r='1.6' fill='%23f5dda2' opacity='.7'/><circle cx='24' cy='24' r='1.6' fill='%23f5dda2' opacity='.7'/></svg>"),

  --board-sink:
    inset 0 0 0 1px rgba(30, 30, 34, 0.35),
    inset 0 5px 9px -8px rgba(40, 38, 32, 0.5);
  /* one sheet of paper grain over the whole grid, not one per square */
  --board-veil:
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23p)' opacity='.5'/></svg>"),
    radial-gradient(130% 120% at 50% 45%, rgba(0, 0, 0, 0) 58%, rgba(60, 52, 38, 0.2) 100%);
  --board-veil-op: 0.55;
  --board-veil-blend: multiply;
}
.theme-ink .sq::before {
  background:
    repeating-linear-gradient(0deg,
      rgba(40, 38, 32, 0.05) 0 1px, rgba(0, 0, 0, 0) 1px 5px),
    repeating-linear-gradient(90deg,
      rgba(40, 38, 32, 0.04) 0 1px, rgba(0, 0, 0, 0) 1px 7px);
  opacity: 0.4;
}
.theme-ink .sq--dark::before { opacity: 0.26; }

/* --- neon: dark tiles, glowing grid lines, a scanline over it all ------ */
.board.theme-neon {
  --frame-mult: 0.016;
  --frame-max: 10px;
  --r-board: 10px;
  background-image:
    linear-gradient(160deg, #13294b 0%, #08101f 58%, #04060c 100%);
  --board-shadow:
    0 0 36px -6px rgba(55, 240, 255, 0.4),
    0 18px 46px -14px rgba(0, 0, 0, 0.85),
    0 0 0 1px rgba(80, 230, 255, 0.4);
  --board-sink:
    inset 0 0 0 1px rgba(80, 230, 255, 0.55),
    inset 0 0 20px rgba(55, 240, 255, 0.18);
  --board-veil:
    radial-gradient(70% 55% at 50% 0%, rgba(255, 79, 216, 0.16) 0%, rgba(0, 0, 0, 0) 68%),
    radial-gradient(70% 55% at 50% 100%, rgba(55, 240, 255, 0.16) 0%, rgba(0, 0, 0, 0) 68%),
    /* the tiles stay dark whatever colors are chosen: the hue still shows
       through, but a neon line has something to burn against */
    linear-gradient(rgba(3, 6, 14, 0.52), rgba(3, 6, 14, 0.52));
  /* the scanline rides over the pieces too, faint enough to be felt */
  --board-over: repeating-linear-gradient(0deg,
    rgba(0, 0, 0, 0.3) 0 1px, rgba(0, 0, 0, 0) 1px 4px);
  --board-over-op: 0.34;
}
.theme-neon .sq::before {
  box-shadow:
    inset 0 0 0 1px rgba(90, 240, 255, 0.32),
    inset 0 0 11px rgba(90, 240, 255, 0.12);
}
.theme-neon .sq--light::before {
  box-shadow:
    inset 0 0 0 1px rgba(255, 120, 230, 0.28),
    inset 0 0 11px rgba(255, 120, 230, 0.1);
}

/* --- toy: a fat rounded frame with a dotted band ----------------------- */
.board.theme-toy {
  --frame-mult: 0.036;
  --frame-max: 24px;
  --r-board: 24px;
  background-image:
    radial-gradient(circle at 50% 50%,
      rgba(255, 255, 255, 0.9) 0 26%, rgba(255, 255, 255, 0) 30%),
    linear-gradient(135deg, #ffb347 0%, #ff7a8a 36%, #a37bff 72%, #54c8ff 100%);
  background-size: calc(var(--frame-w) * 0.92) calc(var(--frame-w) * 0.92), auto;
  background-position: center, 0 0;
  background-repeat: repeat, no-repeat;
  --board-shadow:
    0 12px 0 -3px rgba(45, 42, 70, 0.2),
    0 28px 48px -18px rgba(70, 50, 90, 0.55),
    0 0 0 2px rgba(255, 255, 255, 0.5);
  --board-sink:
    inset 0 0 0 3px rgba(255, 255, 255, 0.8),
    inset 0 0 0 5px rgba(45, 42, 70, 0.16);
  --board-veil: radial-gradient(120% 120% at 50% 40%,
    rgba(255, 255, 255, 0.1) 0%, rgba(90, 60, 110, 0.14) 100%);
}
.theme-toy .sq::before {
  background:
    radial-gradient(125% 85% at 50% 8%,
      rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 58%),
    linear-gradient(180deg, rgba(255, 255, 255, 0) 55%, rgba(60, 40, 20, 0.1) 100%);
}
/* the fragments of a broken toy are chunky and bounce */
body.theme-toy .frag {
  animation-name: fragBounce;
  animation-duration: 0.58s;
  animation-timing-function: cubic-bezier(0.3, 1.5, 0.55, 1);
}
@keyframes fragBounce {
  0% { transform: translate(-50%, -50%) rotate(0deg) scale(1.2); opacity: 1; }
  35% {
    transform: translate(calc(-50% + var(--dx) * 0.6), calc(-50% - var(--sq) * 0.22))
               rotate(calc(var(--rot) * 0.4)) scale(1.1);
    opacity: 1;
  }
  100% {
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
               rotate(var(--rot)) scale(0.9);
    opacity: 0;
  }
}

/* --------------------------------------------------- motion switches --- */

.no-anim *,
.no-anim *::before,
.no-anim *::after {
  animation: none !important;
  transition: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>

              <circle cx="9.9" cy="8.1" r="1.25" fill="currentColor"/>
              <circle cx="14.4" cy="7.7" r="1.25" fill="currentColor"/>
              <circle cx="17.5" cy="11" r="1.25" fill="currentColor"/>

          <div class="combo-row">

    </section>

    </div>
  </div>

/* themes.js - the piece sets and palettes of the themes.
   window.WarGame.Themes = { list, get(id) }

                boardClass, glyph(kind, opts) }

   K knight (the one with the horse), A archer (the one with the bow), so a
   piece stays the same piece when the theme changes.

   A glyph takes the owner's color from currentColor and its contrasting
   outline from var(--piece-outline), both set by .piece in style.css. Fixed
   accents (steel, wood, skin, glow) are used where they read on a light and
   on a dark owner color alike. Inside one theme the three glyphs share one
   line weight and one style, and no detail is finer than the eye can hold at

  var MIRROR_V = 'translate(0,100) scale(1,-1)';

<script>
/* icons.js - composing one piece out of a theme's glyphs and its badges.
   window.WarGame.Icons = { glyph(kind, opts), piece(kinds, opts) }

   for them and keeps the classic set of version 1 as the fallback, so the
   game still draws its pieces when themes.js is missing or an unknown theme
   id is stored in the settings.

   Every shape is filled with currentColor and stroked with --piece-outline,
   so a glyph takes the color of its owner from the element around it. */

window.WarGame = window.WarGame || {};

(function () {
  'use strict';

  /* ------------------------------------------------- the classic fallback */

  var BODY =
    'fill:currentColor;stroke:var(--piece-outline,#1b1d24);stroke-width:4;' +
    'stroke-linejoin:round;stroke-linecap:round';
  var DETAIL = 'fill:var(--piece-outline,#1b1d24);stroke:none';

  /* Soldier: a shield with two swords crossed behind it. */
  function sword(angle) {
    return '<g transform="rotate(' + angle + ' 50 50)">' +
      '<rect x="45.5" y="4" width="9" height="15" rx="4.5"/>' +
      '<rect x="34" y="17" width="32" height="9" rx="4.5"/>' +
      '<path d="M44.5,25 H55.5 V82 L50,94 L44.5,82 Z"/>' +
      '</g>';
  }

  var SOLDIER =
    sword(38) + sword(-38) +
    '<path d="M21,36 H79 V58 C79,75 66,86 50,91 C34,86 21,75 21,58 Z"/>';

  /* Knight: a horse head, as on a chess board, in profile. */
  var KNIGHT =
    '<path d="M27,91 C24,72 29,54 42,44 C50,38 55,29 56,20 ' +
    'C56,14 62,12 65,17 C67,20 67,24 66,28 ' +
    'C71,22 78,23 82,29 C87,37 89,46 89,52 C89,57 85,60 79,60 ' +
    'L64,60 C58,62 55,66 55,74 L55,91 Z"/>';
  var KNIGHT_EYE = '<circle cx="74" cy="41" r="3.2" style="' + DETAIL + '"/>';

  /* Archer: a bow bent into an even arc with a fletched arrow on the string. */
  var ARCHER =
    '<path d="M16,82 C12,72 11,60 13,48 C16,32 30,22 50,22 ' +
    'C70,22 84,32 87,48 C89,60 88,72 84,82 ' +
    'L76,76 C79,67 80,58 78,50 C75,37 65,31 50,31 ' +
    'C35,31 25,37 22,50 C20,58 21,67 24,76 Z"/>' +
    '<path d="M19,78 L50,86 L81,78 L81.5,81 L50,89.5 L18.5,81 Z" ' +
    'style="stroke-width:2.2"/>' +
    '<path d="M46.5,68 L39,80 L39,71.5 L46.5,61 Z ' +
    'M53.5,68 L61,80 L61,71.5 L53.5,61 Z" style="stroke-width:2.4"/>' +
    '<rect x="46.5" y="13" width="7" height="75" rx="3.5"/>' +
    '<path d="M50,2 L61.5,26 L50,21 L38.5,26 Z"/>';

  var SHAPES = { S: SOLDIER, K: KNIGHT, A: ARCHER };
  var DETAILS = { S: '', K: KNIGHT_EYE, A: '' };

  var FLIP = {
    K: 'translate(100,0) scale(-1,1)',
    A: 'translate(0,100) scale(1,-1)'
  };

  function fallbackGlyph(kind, opts) {
    opts = opts || {};
    var shape = SHAPES[kind];
    if (!shape) return '';
    var tr = opts.flip && FLIP[kind] ? ' transform="' + FLIP[kind] + '"' : '';
    var cls = 'glyph glyph--' + kind + (opts.cls ? ' ' + opts.cls : '');
    return '<svg class="' + cls + '" viewBox="0 0 100 100" ' +
      'xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">' +
      '<g' + tr + '><g style="' + BODY + '">' + shape + '</g>' + DETAILS[kind] + '</g>' +
      '</svg>';
  }

  /* ------------------------------------------------------- the badge marks */

  /* a small sword, drawn on its own so the strength badge is never read as
     a second health number */
  var SWORD_MARK =
    '<svg class="mark-ico" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" ' +
    'focusable="false" aria-hidden="true">' +
    '<path d="M20.5 2.2 L21.8 3.5 L11.6 13.7 L10.3 12.4 Z ' +
    'M9.6 13.1 L10.9 14.4 L8 17.3 L6.7 16 Z ' +
    'M5.9 16.8 L7.2 18.1 L4.5 20.8 L2.6 21.4 L3.2 19.5 Z" ' +
    'fill="currentColor"/></svg>';

  /* the bow a piece carries while it still has its shot */
  var BOW_MARK =
    '<svg class="mark-ico" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" ' +
    'focusable="false" aria-hidden="true">' +
    '<path d="M6 2.5 C13 5 13 19 6 21.5" fill="none" stroke="currentColor" ' +
    'stroke-width="2.4" stroke-linecap="round"/>' +
    '<path d="M6 2.5 L6 21.5" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round"/>' +
    '<path d="M6 12 L20 12 M16.5 9 L20 12 L16.5 15" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
    'stroke-linejoin="round"/></svg>';

  /* ------------------------------------------------------------- building */

  function fmtStrength(v) {
    var n = Number(v) || 0;
    return n % 1 === 0 ? String(n) : n.toFixed(1);
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function themeOf(id) {
    var T = window.WarGame.Themes;
    if (!T || typeof T.get !== 'function') return null;
    try {
      var th = T.get(id);
      return th && typeof th.glyph === 'function' ? th : null;
    } catch (e) { return null; }
  }

  /* glyph(kind, opts) -> an <svg> string for one kind, viewBox 0 0 100 100.
     opts: { theme: id, flip: true to face the other way, cls: extra classes } */
  function glyph(kind, opts) {
    opts = opts || {};
    var th = themeOf(opts.theme);
    if (th) {
      var out = th.glyph(kind, { flip: !!opts.flip, cls: opts.cls || '' });
      if (out) return out;
    }
    return fallbackGlyph(kind, opts);
  }

  /* piece(kinds, opts) -> the whole piece: the main glyph, the second kind of
     a hybrid small at the top corner, the health badge at the bottom, the
     strength badge beside it and the bow of a kept shot.
     opts: { owner: 0|1, theme, hp, maxHp, str, fireLeft, badge: false } */
  function piece(kinds, opts) {
    opts = opts || {};
    var owner = opts.owner === 1 ? 1 : 0;
    var list = kinds && kinds.length ? kinds : ['S'];
    var flip = owner === 1;
    var theme = opts.theme;

    var html = '<span class="piece" data-owner="' + owner + '">';
    html += glyph(list[0], { theme: theme, flip: flip, cls: 'glyph--main' });
    if (list.length > 1) {
      html += '<span class="piece-sub">' +
        glyph(list[1], { theme: theme, flip: flip, cls: 'glyph--sub' }) + '</span>';
    }

    if (opts.badge !== false) {
      var hp = Number(opts.hp);
      var maxHp = Number(opts.maxHp);
      if (isFinite(hp)) {
        var hurt = isFinite(maxHp) && hp < maxHp;
        html += '<span class="badge badge--hp' + (hurt ? ' badge--hurt' : '') +
          '" dir="ltr">' + esc(fmtStrength(hp)) + '</span>';
      }
      /* the strength badge only where strength and health part ways */
      var str = Number(opts.str);
      if (isFinite(str) && str > 0 && str !== hp) {
        html += '<span class="badge badge--str" dir="ltr">' + SWORD_MARK +
          '<span>' + esc(fmtStrength(str)) + '</span></span>';
      }
    }

    if (opts.fireLeft) {
      html += '<span class="piece-bow" aria-hidden="true">' + BOW_MARK + '</span>';
    }

    html += '</span>';
    return html;
  }

  window.WarGame.Icons = {
    glyph: glyph,
    piece: piece,
    bowMark: BOW_MARK,
    swordMark: SWORD_MARK,
    fmtStrength: fmtStrength
  };
})();
</script>
<script>
/* War Game rules engine, version 2. Classic script, no modules, no DOM.
   Every function returns new data and never mutates its arguments. */
(function (global) {
  'use strict';

  var KINDS = {
    S: { str: 1, hp: 1, move: 2, fire: 0, range: 0 },
    K: { str: 3, hp: 3, move: 4, fire: 0, range: 0 },
    A: { str: 0, hp: 3, move: 2, fire: 2, range: 2 }
  };

  var COMBOS = [['K', 'S'], ['K', 'A'], ['S', 'S', 'S'], ['A', 'S', 'S'], ['A', 'A', 'S']];

  var DEFAULT_RULES = { diagonalMoves: true };

  var ORTHO = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  var DIAGONAL = [[-1, -1], [-1, 1], [1, -1], [1, 1]];

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function illegal() { throw new Error('illegal action'); }

  function onBoard(row, col) { return row >= 0 && row < 8 && col >= 0 && col < 8; }

  function key(row, col) { return row + ',' + col; }

  // Player 0 advances toward row 7, player 1 toward row 0.
  function farRow(owner) { return owner === 0 ? 7 : 0; }

  /* ---------- pieces ---------- */

  function comboKind(piece) {
    if (piece.kinds.indexOf('K') >= 0) return 'K';
    if (piece.kinds.indexOf('A') >= 0) return 'A';
    return 'S';
  }

  function pieceStats(piece) {
    var baseStr = 0, baseHp = 0, move = 0, fire = 0, range = 0;
    piece.kinds.forEach(function (k) {
      baseStr += KINDS[k].str;               // melee strength adds up
      baseHp += KINDS[k].hp;                 // so does health
      move = Math.max(move, KINDS[k].move);  // a hybrid moves as the faster of its kinds
      fire += KINDS[k].fire;                 // fire strength adds up
      range = Math.max(range, KINDS[k].range); // fire range is the longer of the two
    });
    var hp = piece.hp;
    return {
      str: Math.min(hp, baseStr),            // health caps the melee strength
      baseStr: baseStr,
      hp: hp,
      maxHp: piece.maxHp === undefined ? baseHp : piece.maxHp,
      move: move, fire: fire, range: range,
      comboKind: comboKind(piece)
    };
  }

  function makePiece(owner, index, kind, row, col) {
    return {
      id: 'p' + owner + '-' + index,
      owner: owner,
      kinds: [kind],
      hp: KINDS[kind].hp,
      maxHp: KINDS[kind].hp,
      row: row, col: col
    };
  }

  function pieceAt(state, row, col) {
    var ids = Object.keys(state.pieces);
    for (var i = 0; i < ids.length; i++) {
      var p = state.pieces[ids[i]];
      if (p.row === row && p.col === col) return p;
    }
    return null;
  }

  function piecesOf(state, player) {
    return Object.keys(state.pieces)
      .map(function (id) { return state.pieces[id]; })
      .filter(function (p) { return p.owner === player; });
  }

  function occupancy(state) {
    var occ = {};
    Object.keys(state.pieces).forEach(function (id) {
      var p = state.pieces[id];
      occ[key(p.row, p.col)] = p;
    });
    return occ;
  }

  /* ---------- setup ---------- */

  function newGame(rules, firstPlayer) {
    var r = { diagonalMoves: DEFAULT_RULES.diagonalMoves };
    if (rules && 'diagonalMoves' in rules) r.diagonalMoves = !!rules.diagonalMoves;
    var first = (firstPlayer === 0 || firstPlayer === 1) ? firstPlayer : (Math.random() < 0.5 ? 0 : 1);

    var pieces = {};
    [0, 1].forEach(function (owner) {
      var back = owner === 0 ? 0 : 7;
      var step = owner === 0 ? 1 : -1; // toward the middle of the board
      var n = 0, c;
      for (c = 0; c < 8; c++) { var s = makePiece(owner, n++, 'S', back, c); pieces[s.id] = s; }
      for (c = 2; c <= 5; c++) { var k = makePiece(owner, n++, 'K', back + step, c); pieces[k.id] = k; }
      for (c = 2; c <= 5; c++) { var a = makePiece(owner, n++, 'A', back + 2 * step, c); pieces[a.id] = a; }
    });

    return {
      rules: r,
      pieces: pieces,
      turn: { player: first, number: 1, used: [] },
      pendingMerge: null,
      winner: null,
      firstPlayer: first
    };
  }

  /* ---------- combinations ---------- */

  function kindCounts(kinds) {
    var c = { K: 0, A: 0, S: 0 };
    kinds.forEach(function (k) { c[k] += 1; });
    return c;
  }

  // True when the multiset of kinds fits inside at least one allowed combination.
  function fitsSomeCombo(kinds) {
    var c = kindCounts(kinds);
    return COMBOS.some(function (combo) {
      var cc = kindCounts(combo);
      return c.K <= cc.K && c.A <= cc.A && c.S <= cc.S;
    });
  }

  function usedKinds(state) {
    return state.turn.used
      .filter(function (u) { return u.kind !== null && u.kind !== undefined; }) // heals carry no kind
      .map(function (u) { return u.kind; });
  }

  function activatableKinds(state) {
    var used = usedKinds(state);
    var out = new Set();
    ['K', 'A', 'S'].forEach(function (k) {
      if (fitsSomeCombo(used.concat([k]))) out.add(k);
    });
    return out;
  }

  function usedEntry(state, id) {
    var used = state.turn.used;
    for (var i = 0; i < used.length; i++) {
      if (used[i].id === id) return used[i];
    }
    return null;
  }

  function isUsed(state, id) { return usedEntry(state, id) !== null; }

  // The piece is the mover's, the game is running and nothing is waiting on a merge.
  function isPlayable(state, id) {
    var p = state.pieces[id];
    return !!p &&
      state.winner === null &&
      state.pendingMerge === null &&
      p.owner === state.turn.player;
  }

  function isFree(state, id) {
    return isPlayable(state, id) && !isUsed(state, id);
  }

  function canActivate(state, id) {
    if (!isFree(state, id)) return false;
    return activatableKinds(state).has(comboKind(state.pieces[id]));
  }

  function canHeal(state, id) {
    if (!isFree(state, id)) return false;
    var p = state.pieces[id];
    return p.hp < p.maxHp;
  }

  // A piece that moved one step and kept its shot may still fire this turn.
  function canFireAgain(state, id) {
    if (!isPlayable(state, id)) return false;
    var e = usedEntry(state, id);
    return !!e && e.fireLeft === true;
  }

  /* ---------- movement ---------- */

  function stepDirs(state) {
    var dirs = ORTHO.map(function (d) { return { d: d, cost: 1 }; });
    if (state.rules && state.rules.diagonalMoves) {
      dirs = dirs.concat(DIAGONAL.map(function (d) { return { d: d, cost: 2 }; }));
    }
    return dirs;
  }

  /* Dijkstra over step costs. Own pieces (and the start square) are passed over
     freely, an enemy square ends a path and is never passed over, and a path
     never ends on an own piece. Ties in cost are broken by the shorter path, so
     a diagonal neighbour is one step rather than two around a corner. */
  function reachable(state, id) {
    var p = state.pieces[id];
    if (!p) return {};
    var budget = pieceStats(p).move;
    var occ = occupancy(state);
    var dirs = stepDirs(state);
    var start = key(p.row, p.col);
    var nodes = {}, done = {};
    nodes[start] = { row: p.row, col: p.col, cost: 0, steps: 0, path: [] };

    for (;;) {
      var bestKey = null, best = null;
      Object.keys(nodes).forEach(function (k) {
        if (done[k]) return;
        var n = nodes[k];
        if (!best || n.cost < best.cost || (n.cost === best.cost && n.steps < best.steps)) {
          best = n; bestKey = k;
        }
      });
      if (!bestKey) break;
      done[bestKey] = true;

      var here = best;
      var sitting = occ[bestKey];
      if (sitting && sitting.owner !== p.owner) continue; // an enemy is never passed over

      dirs.forEach(function (s) {
        var row = here.row + s.d[0], col = here.col + s.d[1];
        if (!onBoard(row, col)) return;
        var k = key(row, col);
        if (done[k]) return;
        var cost = here.cost + s.cost;
        if (cost > budget) return;
        var steps = here.steps + 1;
        var cur = nodes[k];
        if (cur && (cur.cost < cost || (cur.cost === cost && cur.steps <= steps))) return;
        nodes[k] = { row: row, col: col, cost: cost, steps: steps, path: here.path.concat([{ row: row, col: col }]) };
      });
    }

    var out = {};
    Object.keys(nodes).forEach(function (k) {
      if (k === start) return;
      var sitting = occ[k];
      if (sitting && sitting.owner === p.owner) return; // a path never ends on an own piece
      var n = nodes[k];
      out[k] = { cost: n.cost, steps: n.steps, path: n.path };
    });
    return out;
  }

  /* ---------- fire ---------- */

  // Same row or column only, at most `range` squares away; nothing in between blocks.
  function inFireRange(shooter, target, range) {
    var dr = Math.abs(target.row - shooter.row);
    var dc = Math.abs(target.col - shooter.col);
    if (dr !== 0 && dc !== 0) return false;
    var dist = dr + dc;
    return dist > 0 && dist <= range;
  }

  function fireActions(state, p, st) {
    var out = [];
    if (st.fire <= 0) return out;
    piecesOf(state, 1 - p.owner).forEach(function (t) {
      if (inFireRange(p, t, st.range)) out.push({ type: 'fire', target: t.id });
    });
    return out;
  }

  /* ---------- legal actions ---------- */

  function legalActions(state, id) {
    var p = state.pieces[id];
    if (!p) return [];
    var st = pieceStats(p);
    var out = [];

    if (canActivate(state, id)) {
      var reach = reachable(state, id);
      Object.keys(reach).forEach(function (k) {
        var n = reach[k];
        var to = n.path[n.path.length - 1];
        var occ = pieceAt(state, to.row, to.col);
        if (!occ) {
          out.push({ type: 'move', to: { row: to.row, col: to.col }, cost: n.cost, path: n.path });
        } else if (occ.owner !== p.owner && st.str > 0) {
          // melee needs strength above 0, so an archer never attacks
          out.push({ type: 'attack', target: occ.id, cost: n.cost, path: n.path });
        }
      });
      out = out.concat(fireActions(state, p, st));
    } else if (canFireAgain(state, id)) {
      out = out.concat(fireActions(state, p, st));
    }

    if (canHeal(state, id)) out.push({ type: 'heal' });
    return out;
  }

  function hasAnyAction(state) {
    return piecesOf(state, state.turn.player).some(function (p) {
      return legalActions(state, p.id).length > 0;
    });
  }

  /* ---------- applying actions ---------- */

  function checkGameOver(s, events) {
    var n0 = piecesOf(s, 0).length, n1 = piecesOf(s, 1).length;
    if (n0 > 0 && n1 > 0) return false;
    s.winner = (n0 === 0 && n1 === 0) ? 'draw' : (n0 === 0 ? 1 : 0);
    events.push({ type: 'gameOver', winner: s.winner });
    return true;
  }

  // Called after every action. `mover` is the piece that ended a move or an attack alive, if any.
  function finishAction(s, events, mover) {
    if (checkGameOver(s, events)) return;
    if (mover && s.pieces[mover.id] && mover.kinds.length === 1 && mover.row === farRow(mover.owner)) {
      s.pendingMerge = mover.id;
      events.push({ type: 'mergePending', id: mover.id });
    }
  }

  function applyMove(s, action, events) {
    var p = s.pieces[action.piece];
    if (!p || !action.to || !canActivate(s, p.id)) illegal();
    var n = reachable(s, p.id)[key(action.to.row, action.to.col)];
    if (!n) illegal();
    if (pieceAt(s, action.to.row, action.to.col)) illegal(); // a move ends on an empty square

    var from = { row: p.row, col: p.col };
    p.row = action.to.row;
    p.col = action.to.col;
    // a firing piece that took a single step keeps its shot for later in the turn
    var fireLeft = pieceStats(p).fire > 0 && n.steps === 1;
    events.push({
      type: 'move', id: p.id, from: from, to: { row: p.row, col: p.col },
      path: n.path, cost: n.cost, fireLeft: fireLeft
    });
    s.turn.used.push({ id: p.id, kind: comboKind(p), fireLeft: fireLeft });
    finishAction(s, events, p);
  }

  function applyAttack(s, action, events) {
    var p = s.pieces[action.piece], t = s.pieces[action.target];
    if (!p || !t || !canActivate(s, p.id) || t.owner === p.owner) illegal();
    var n = reachable(s, p.id)[key(t.row, t.col)];
    if (!n) illegal();

    var a = pieceStats(p).str, d = pieceStats(t).str; // both taken before any damage
    if (a <= 0) illegal();
    var from = { row: p.row, col: p.col }, to = { row: t.row, col: t.col };
    p.hp -= d;
    t.hp -= a;
    var attackerDies = p.hp <= 0, defenderDies = t.hp <= 0;
    // the attacker takes the square only when it survives and the defender died
    var attackerMoved = !attackerDies && defenderDies;

    events.push({
      type: 'attack', attacker: p.id, defender: t.id,
      from: from, to: to, path: n.path,
      attackerLoss: d, defenderLoss: a, attackerMoved: attackerMoved
    });
    if (defenderDies) {
      events.push({ type: 'die', id: t.id, owner: t.owner, at: to });
      delete s.pieces[t.id];
    }
    if (attackerDies) {
      events.push({ type: 'die', id: p.id, owner: p.owner, at: from });
      delete s.pieces[p.id];
    }
    if (attackerMoved) { p.row = to.row; p.col = to.col; }

    s.turn.used.push({ id: p.id, kind: comboKind(p), fireLeft: false });
    finishAction(s, events, attackerDies ? null : p);
  }

  function applyFire(s, action, events) {
    var p = s.pieces[action.piece], t = s.pieces[action.target];
    if (!p || !t || t.owner === p.owner) illegal();
    var again = canFireAgain(s, p.id);
    if (!again && !canActivate(s, p.id)) illegal();
    var st = pieceStats(p);
    if (st.fire <= 0 || !inFireRange(p, t, st.range)) illegal();

    var damage = st.fire;
    t.hp -= damage; // the shooter loses nothing and does not move
    events.push({ type: 'fire', shooter: p.id, target: t.id, damage: damage });
    if (t.hp <= 0) {
      events.push({ type: 'die', id: t.id, owner: t.owner, at: { row: t.row, col: t.col } });
      delete s.pieces[t.id];
    }
    if (again) usedEntry(s, p.id).fireLeft = false; // the kept shot fills no combination slot
    else s.turn.used.push({ id: p.id, kind: comboKind(p), fireLeft: false });
    finishAction(s, events, null);
  }

  function applyHeal(s, action, events) {
    var p = s.pieces[action.piece];
    if (!p || !canHeal(s, p.id)) illegal();
    var amount = Math.min(0.5, p.maxHp - p.hp);
    p.hp += amount;
    events.push({ type: 'heal', id: p.id, amount: amount, hp: p.hp });
    s.turn.used.push({ id: p.id, kind: null, fireLeft: false }); // a heal fills no combination slot
    finishAction(s, events, null);
  }

  function applyMerge(s, action, events) {
    var p = s.pieces[action.piece];
    if (!p || s.pendingMerge !== action.piece) illegal();
    if (!KINDS[action.kind]) illegal();
    var own = p.kinds[0], added = action.kind;
    p.kinds = [own, added];
    p.maxHp = KINDS[own].hp + KINDS[added].hp;
    p.hp += KINDS[added].hp;
    s.pendingMerge = null;
    events.push({ type: 'merge', id: p.id, kinds: p.kinds.slice() });
  }

  function applySkipMerge(s, action) {
    if (!s.pieces[action.piece] || s.pendingMerge !== action.piece) illegal();
    s.pendingMerge = null;
  }

  function startTurn(s, events) {
    s.turn.player = 1 - s.turn.player;
    s.turn.number += 1;
    s.turn.used = [];
    events.push({ type: 'turnStart', player: s.turn.player, number: s.turn.number });
  }

  function applyEndTurn(s, events) {
    if (s.winner !== null || s.pendingMerge !== null) illegal();
    events.push({ type: 'turnEnd', player: s.turn.player });
    for (var i = 0; i < 2; i++) {
      startTurn(s, events);
      if (hasAnyAction(s)) return;
      events.push({ type: 'pass', player: s.turn.player }); // no legal action: skip this player
    }
    s.winner = 'draw'; // neither player can act
    events.push({ type: 'gameOver', winner: 'draw' });
  }

  function apply(state, action) {
    var s = clone(state);
    var events = [];
    var type = action && action.type;
    if (type === 'move') applyMove(s, action, events);
    else if (type === 'attack') applyAttack(s, action, events);
    else if (type === 'fire') applyFire(s, action, events);
    else if (type === 'heal') applyHeal(s, action, events);
    else if (type === 'merge') applyMerge(s, action, events);
    else if (type === 'skipMerge') applySkipMerge(s, action);
    else if (type === 'endTurn') applyEndTurn(s, events);
    else illegal();
    return { state: s, events: events };
  }

  /* ---------- serialization ---------- */

  function toBase64Url(text) {
    return global.btoa(text).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromBase64Url(text) {
    var b = text.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4 !== 0) b += '=';
    return global.atob(b);
  }

  function serialize(state) {
    return 'WG2.' + toBase64Url(JSON.stringify(state));
  }

  function deserialize(text) {
    // a version 1 code carries version 1 pieces, so it is refused rather than read
    if (typeof text !== 'string' || text.slice(0, 4) !== 'WG2.') throw new Error('bad game code');
    var state;
    try {
      state = JSON.parse(fromBase64Url(text.slice(4)));
    } catch (e) {
      throw new Error('bad game code');
    }
    if (!state || typeof state !== 'object' || !state.pieces || !state.turn || !state.rules) {
      throw new Error('bad game code');
    }
    return state;
  }

  global.WarGame = global.WarGame || {};
  global.WarGame.Engine = {
    KINDS: KINDS,
    COMBOS: COMBOS,
    DEFAULT_RULES: DEFAULT_RULES,
    newGame: newGame,
    pieceStats: pieceStats,
    comboKind: comboKind,
    pieceAt: pieceAt,
    piecesOf: piecesOf,
    usedKinds: usedKinds,
    activatableKinds: activatableKinds,
    canActivate: canActivate,
    canHeal: canHeal,
    canFireAgain: canFireAgain,
    reachable: reachable,
    legalActions: legalActions,
    hasAnyAction: hasAnyAction,
    apply: apply,
    serialize: serialize,
    deserialize: deserialize
  };
})(window);
</script>
<script>
/* =====================================================================
   ui.js - the board, the overlays, input, animation, settings, storage,
   the invite and the service worker.
   window.WarGame.UI
   ===================================================================== */

window.WarGame = window.WarGame || {};

(function () {
  'use strict';

  var I18N = window.WarGame.I18N;
  var Icons = window.WarGame.Icons;
  var Engine = window.WarGame.Engine;

  /* ------------------------------------------------------- constants --- */

  var SETTINGS_KEY = 'wargame.settings';
  var GAME_KEY = 'wargame.game';
  var KIND_ORDER = ['K', 'A', 'S'];

  /* the link is a constant, so an invite sent from a file:// copy or from
     the home-screen app still points at the page everyone can open */
  var GAME_URL = 'https://leoreh.github.io/Cole-s-War-Game/';

  var DEFAULT_SETTINGS = {
    lang: null,
    theme: 'classic',
    p0: '#efe6cf',
    p1: '#2f3550',
    sqLight: '#efe0c3',
    sqDark: '#a97e57',
    randomBoard: false,
    boardColors: null,
    animations: true,
    coordinates: false,
    diagonalMoves: true
  };

  var PRESETS = [
    { id: 'wood', p0: '#efe6cf', p1: '#2f3550', sqLight: '#efe0c3', sqDark: '#a97e57' },
    { id: 'marble', p0: '#fdfcf8', p1: '#363b46', sqLight: '#ebe9e3', sqDark: '#98a0a9' },
    { id: 'forest', p0: '#f4f1da', p1: '#21402c', sqLight: '#dfe7cc', sqDark: '#6d8f5d' },
    { id: 'ocean', p0: '#eaf5fa', p1: '#0f3450', sqLight: '#d6e9f1', sqDark: '#5a8fa9' },
    { id: 'rose', p0: '#fff2f0', p1: '#5c1f33', sqLight: '#f5dfe0', sqDark: '#c08497' },
    { id: 'night', p0: '#e9e5f2', p1: '#15161c', sqLight: '#4b5065', sqDark: '#2b2f3d' }
  ];

  /* ------------------------------------------------------- app state --- */

  var G = {
    settings: null,
    state: null,      /* the game being played, null when none is running */
    idle: null,       /* the opening position drawn behind the menu */
    history: [],      /* states before each action of the current turn */
    sel: null,        /* id of the selected piece */
    acts: [],         /* its legal actions */
    busy: false,      /* animating: input is blocked */
    inviteMode: 'app',
    boardClass: ''    /* the theme class now on the board and on <body> */
  };

  var el = {};          /* cached nodes */
  var pieceEls = {};    /* piece id -> its .pc element */
  var reduceMotion = null;

  /* ---------------------------------------------------- small helpers --- */

  function $(id) { return document.getElementById(id); }

  function t(key, vars) { return I18N.t(key, vars); }

  function make(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function clearNode(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function fmt(v) { return Icons.fmtStrength(v); }

  function hexToRgb(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    if (!isFinite(n)) return { r: 128, g: 128, b: 128 };
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function luminance(hex) {
    var c = hexToRgb(hex);
    function ch(v) {
      v = v / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    }
    return 0.2126 * ch(c.r) + 0.7152 * ch(c.g) + 0.0722 * ch(c.b);
  }

  /* a dark outline on a light piece, a light outline on a dark one */
  function outlineFor(hex) {
    return luminance(hex) > 0.42 ? '#191c24' : '#f6f4ef';
  }

  function playerColor(p) { return p === 1 ? G.settings.p1 : G.settings.p0; }

  /* activatableKinds gives a Set; an array reads the same way here */
  function inKinds(set, kind) {
    if (!set) return false;
    if (typeof set.has === 'function') return set.has(kind);
    return Array.prototype.indexOf.call(set, kind) >= 0;
  }

  function animOn() {
    return !!(G.settings && G.settings.animations) &&
      !(reduceMotion && reduceMotion.matches);
  }

  function wait(ms) {
    var d = animOn() ? ms : 0;
    return new Promise(function (r) { setTimeout(r, d); });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* --------------------------------------------------------- themes ---- */

  function Themes() { return window.WarGame.Themes; }

  function themeList() {
    var T = Themes();
    if (T && T.list && T.list.length) return T.list.slice();
